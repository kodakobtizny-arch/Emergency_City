function material(color,roughness=.8){

    return new THREE.MeshStandardMaterial({
        color,
        roughness
    });
}

function cube(
    x,y,z,
    sx,sy,sz,
    color,
    options={}
){

    const mesh =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                sx,sy,sz
            ),
            material(
                color,
                options.roughness ?? .8
            )
        );

    mesh.position.set(x,y,z);

    if(options.cast!==false)
        mesh.castShadow=true;

    if(options.receive!==false)
        mesh.receiveShadow=true;

    scene.add(mesh);

    return mesh;
}

function plane(
    x,y,z,
    sx,sz,
    color
){

    return cube(
        x,
        y,
        z,
        sx,
        .05,
        sz,
        color,
        {cast:false}
    );
}

function windowPanel(
    x,y,z,
    w,h,
    rot="front"
){

        x,y,z

        cube(
            x-w/2-.03,
            y,
            z-.04,
            .08,
            h+.1,
            .08,
            0x444444

            x+w/2+.03,
            y,
            z-.04,
            .08,
            h+.1,
            .08,
            0x444444
        );
    }
}

function detailedBuilding(
    x,
    z,
    width,
    depth,
    height,
    floors
){

    const color =
        facades[
            Math.floor(
                Math.random()*facades.length
            )
        ];

    /* hlavní budova */

    cube(
        x,
        height/2,
        z,
        width,
        height,
        depth,
        color
    );

    /* střecha */

    cube(
        x,
        height+.18,
        z,
        width+.3,
        .35,
        depth+.3,
        0x3d3d3d
    );

    /* římsy */

    for(let f=1;f<floors;f++){

        const y =
            (height/floors)*f;

        cube(
            x,
            y,
            z-depth/2-.03,
            width+.15,
            .13,
            .12,
            0x686868
        );
    }

    const floorHeight =
        height/floors;

    /* přední okna */

    for(
        let f=0;
        f<floors;
        f++
    ){

        const y =
            floorHeight*f+
            floorHeight*.52;

        const columns =
            Math.max(
                2,
                Math.floor(width/7)
            );

        for(
            let c=0;
            c<columns;
            c++
        ){

            const spacing =
                width/(columns+1);

            const wx =
                x-width/2+
                spacing*(c+1);

            windowPanel(
                wx,
                y,
                z-depth/2-.07,
                1.7,
                1.4
            );
        }
    }

    /* boční okna */

    for(
        let f=0;
        f<floors;
        f++
    ){

        const y =
            floorHeight*f+
            floorHeight*.52;

        const rows =
            Math.max(
                2,
                Math.floor(depth/8)
            );

        for(
            let r=0;
            r<rows;
            r++
        ){

            const spacing =
                depth/(rows+1);

            const wz =
                z-depth/2+
                spacing*(r+1);

            const glass=
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        .06,
                        1.4,
                        1.7
                    ),
                    new THREE.MeshStandardMaterial({
                        color:0x263f4c,
                        roughness:.25
                    })
                );

            glass.position.set(
                x-width/2-.07,
                y,
                wz
            );

            scene.add(glass);
        }
    }

    /* vchod */

    cube(
        x,
        1.4,
        z-depth/2-.13,
        2.4,
        2.8,
        .15,
        0x252b30
    );

    /* schody */

    cube(
        x,
        .18,
        z-depth/2-.9,
        3,
        .25,
        1.5,
        0x666666
    );
}

/* městské bloky */

            bz,
            width,
            depth,
            height,
            floors
        );
    }
}

function createCar(

            new THREE.BoxGeometry(
                1.65,
                .7,

            material(
                0x303c45,
                .2
            )

        0,
        1.12,
        -.15
    );

    car.add(cabin);

    /* kola */

        const wx of [-1.05,1.05]
    ){

            const wz of [-1.35,1.35]
        ){

            const wheel=
                new THREE.Mesh(
                    new THREE.CylinderGeometry(

                        .38,
                        .22,
                        12
                    ),
                    material(
                        0x151515
                    )

            wheel.rotation.z=
                Math.PI/2;

            wheel.position.set(
                wx,
                .42,
                wz
            );

            car.add(wheel);
        }
    }

    /* světla */

    cube(
        0,
        .7,
        -2.13,
        .7,
        .22,
        .08,
        0xff3333
    ).parent=car;

    cube(
        0,
        .7,
        2.13,
        .7,
        .22,
        .08,
        0xffffff
    ).parent=car;

    car.position.set(
        x,
        0,
        z
    );

    car.rotation.y=
        rotation;

    scene.add(car);
}

/* =====================================================
   OSTATNÍ HRÁČI
===================================================== */

const otherPlayers=
    new Map();

function createOtherPlayer(p){

    if(
        otherPlayers.has(p.id)
    ) return;

    const group=
        new THREE.Group();

    const b=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1.2,
                2,
                .7
            ),
            material(0xc62e36)
        );

    b.position.y=1.3;

    group.add(b);

    const h=
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .55,
                16,
                12
            ),
            material(0xffc49c)
        );

    h.position.y=2.7;

    group.add(h);

    scene.add(group);

    otherPlayers.set(
        p.id,
        group
    );
}

function updatePlayers(list){

    const ids=
        new Set(
            list.map(
                p=>p.id
            )
        );

    for(
        const [id,g]
        of otherPlayers
    ){

        if(!ids.has(id)){

            scene.remove(g);

            otherPlayers.delete(id);
        }
    }

    for(
        const p of list
    ){

        if(p.id===myId)
            continue;

        createOtherPlayer(p);

        const g=
            otherPlayers.get(p.id);

        g.position.set(
            p.x,
            0,
            p.z
        );

        g.rotation.y=
            p.rot || 0;
    }
}

let yaw=0;

renderer.domElement.addEventListener(
    "click",
    ()=>{
        renderer.domElement.requestPointerLock();
    }
);

    "mousemove",
    e=>{

            document.pointerLockElement
        ){

            yaw -=
                e.movementX*.002;
        }
    }
);

/* =====================================================
   WEBSOCKET
===================================================== */

let socket=null;
let myId=null;

let myMoney=500;
let myJob="Civilian";

function connect(){

    const protocol=
        location.protocol==="https:"
        ? "wss:"
        : "ws:";

    socket=
        new WebSocket(
            protocol+
            "//"+
            location.host
        );

    socket.onopen=()=>{

        console.log(
            "Connected"
        );
    };

    socket.onmessage=e=>{

        try{

            const data=
                JSON.parse(e.data);

            if(
                data.type==="welcome"
            ){

                myId=data.id;

                myMoney=
                    data.self.cash;

                myJob=
                    data.self.job;

                updateUI();
            }

            if(
                data.type==="state"
            ){

                updatePlayers(
                    data.players
                );

                document.getElementById(
                    "players"
                ).textContent=
                    data.players.length;
            }

        }catch(err){

            console.log(err);
        }
    };

    socket.onclose=()=>{

        setTimeout(
            connect,
            2000
        );
    };
}

connect();

/* =====================================================
   PRÁCE
===================================================== */

window.setJob=function(job){

    myJob=job;

    if(
        socket &&
        socket.readyState===
        WebSocket.OPEN
    ){

        socket.send(
            JSON.stringify({
                type:"job",
                job
            })
        );
    }

    updateUI();

    showEvent(
        "Nová práce: "+job
    );
};

/* =====================================================
   ODMĚNY
===================================================== */

function reward(amount){

    if(
        socket &&
        socket.readyState===
        WebSocket.OPEN
    ){

        socket.send(
            JSON.stringify({
                type:"reward",
                amount
            })
        );
    }

    myMoney+=amount;

    updateUI();
}

/* =====================================================
   UI
===================================================== */

function updateUI(){

    document.getElementById(
        "money"
    ).textContent=
        Math.floor(myMoney);

    document.getElementById(
        "job"
    ).textContent=
        myJob;
}

function showEvent(text){

    const el=
        document.getElementById(
            "event"
        );

    el.textContent=text;

    el.style.display=
        "block";

    setTimeout(
        ()=>{
            el.style.display=
                "none";
        },
        2500
    );
}

/* =====================================================
   EVENTY
===================================================== */

setInterval(()=>{

    const events=[
        "🚗 Dopravní nehoda!",
        "🚑 Potřebná sanitka!",
        "🔥 Požár ve městě!",
        "🚓 Policejní výzva!",
        "🚦 Dopravní kolona!"
    ];

    const event=
        events[
            Math.floor(
                Math.random()*
                events.length
            )
        ];

    showEvent(event);

    if(
        myJob==="Police" ||
        myJob==="Medic" ||
        myJob==="Firefighter"
    ){

        setTimeout(
            ()=>{

                reward(100);

                showEvent(
                    "💰 Výjezd dokončen +$100"
                );

            },
            3000
        );
    }

},15000);

/* =====================================================
   GAME LOOP
===================================================== */

const clock=
    new THREE.Clock();

let lastNetwork=0;

function animate(){

    requestAnimationFrame(
        animate
    );

    const dt=
        Math.min(
            clock.getDelta(),
            .05
        );

    const speed=
        keys["shift"]
        ? 22
        : 11;

    let dx=0;
    let dz=0;

    if(keys["w"]) dz-=1;
    if(keys["s"]) dz+=1;
    if(keys["a"]) dx-=1;
    if(keys["d"]) dx+=1;

    if(dx!==0 || dz!==0){

        const length=
            Math.hypot(dx,dz);

        dx/=length;
        dz/=length;

        const sin=
            Math.sin(yaw);

        const cos=
            Math.cos(yaw);

        const moveX=
            dx*cos-dz*sin;

        const moveZ=
            dx*sin+dz*cos;

        player.position.x +=
            moveX*speed*dt;

        player.position.z +=
            moveZ*speed*dt;

        player.position.x=
            THREE.MathUtils.clamp(
                player.position.x,
                -320,
                320
            );

        player.position.z=
            THREE.MathUtils.clamp(
                player.position.z,
                -320,
                320
            );

        player.rotation.y=
            Math.atan2(
                moveX,
                moveZ
            );
    }

    /* kamera */

    camera.position.x=
        player.position.x+
        Math.sin(yaw)*8;

    camera.position.z=
        player.position.z+
        Math.cos(yaw)*8;

    camera.position.y=5.2;

    camera.lookAt(
        player.position.x,
        1.4,
        player.position.z
    );

    /* server */

    const now=
        performance.now();

    if(
        socket &&
        socket.readyState===
        WebSocket.OPEN &&
        now-lastNetwork>60
    ){

        socket.send(
            JSON.stringify({
                type:"update",
                x:player.position.x,
                z:player.position.z,
                rot:player.rotation.y
            })
        );

        lastNetwork=now;
    }

    renderer.render(
        scene,
        camera
    );
}

animate();

/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);

</script>
