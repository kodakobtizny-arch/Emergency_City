    String(settings.fps);

document.getElementById("shadows").value =

document.getElementById("distance").value =

    settings.graphics =

    settings.fps =

function cube(

    sx,sy,sz,
    material
){

    const m =

    m.position.set(
        x,y,z
    );

    m.castShadow = settings.shadows;
    m.receiveShadow = settings.shadows;

    scene.add(m);

    return m;
}

/* =====================================================
   MOUSE LOOK
===================================================== */

let yaw=0;
let pitch=0;

document.addEventListener(
    "mousemove",
    e=>{

        if(!gameStarted)
            return;

        if(document.pointerLockElement){

            yaw -= e.movementX*.002;

            pitch -= e.movementY*.002;

            pitch =
                THREE.MathUtils.clamp(
                    pitch,
                    -1.45,
                    1.45
                );
        }
    }
);


/* =====================================================
   AMMO
===================================================== */

let ammo=30;
let reserve=90;
let reloading=false;

function updateAmmo(){

    document.getElementById(
        "ammo"
    ).innerHTML =
        `${ammo} <small>/ ${reserve}</small>`;
}

updateAmmo();


/* =====================================================
   SHOOT
===================================================== */

let recoil=0;
let recoilSide=0;

function shoot(){

    if(!gameStarted)
        return;

    if(reloading)
        return;

    if(ammo<=0){

        reload();

        return;
    }

    ammo--;

    updateAmmo();

    recoil=.16;

    recoilSide =
        (Math.random()-.5)*.04;

    flash.intensity=7;

    setTimeout(
        ()=>flash.intensity=0,
        45
    );


    /* hit detection */

    const ray =
        new THREE.Raycaster();

    ray.setFromCamera(
        new THREE.Vector2(0,0),
        camera
    );

    const hits =
        ray.intersectObjects(
            scene.children,
            true
        );

    let target=null;

    for(const hit of hits){

        let obj=hit.object;

        while(obj){

            if(
                obj.userData &&
                obj.userData.playerId
            ){

                target =
                    obj.userData.playerId;

                break;
            }

            obj=obj.parent;
        }

        if(target)
            break;
    }

    if(target &&
       socket &&
       socket.readyState===1){

        socket.send(
            JSON.stringify({
                type:"hit",
                target:target,
                damage:25
            })
        );

        showHitmarker();
    }
}


/* =====================================================
   SHOOT MOUSE
===================================================== */

document.addEventListener(
    "mousedown",
    e=>{

        if(
            gameStarted &&
            document.pointerLockElement &&
            e.button===0
        ){

            shoot();
        }
    }
);


/* =====================================================
   RELOAD
===================================================== */

function reload(){

    if(reloading)
        return;

    if(ammo===30)
        return;

    if(reserve<=0)
        return;

    reloading=true;

    weapon.position.y -= .12;
    weapon.rotation.x=-.45;

    setTimeout(
        ()=>{
            magazine.rotation.x=.8;
        },
        180
    );

    setTimeout(
        ()=>{
            magazine.rotation.x=-.18;
        },
        550
    );

    setTimeout(
        ()=>{

            const needed =
                30-ammo;

            const take =
                Math.min(
                    needed,
                    reserve
                );

            ammo+=take;
            reserve-=take;

            weapon.position.y += .12;
            weapon.rotation.x=0;

            updateAmmo();

            reloading=false;

        },
        850
    );
}


/* =====================================================
   HITMARKER
===================================================== */

function showHitmarker(){

    const h =
        document.getElementById(
            "hitmarker"
        );

    h.style.opacity=1;

    setTimeout(
        ()=>h.style.opacity=0,
        100
    );
}


/* =====================================================
   WEAPON ANIMATION
===================================================== */

function updateWeapon(){

    recoil*=.78;
    recoilSide*=.78;

    weapon.position.z =
        -.85+recoil;

    weapon.rotation.x =
        recoil*1.8;

    weapon.rotation.y =
        recoilSide;

    if(
        keys.KeyW ||
        keys.KeyA ||
        keys.KeyS ||
        keys.KeyD
    ){

        const t =
            performance.now()*.012;

        weapon.position.y +=
            Math.sin(t)*.004;

        weapon.position.x +=
            Math.cos(t*.7)*.003;
    }
}

    const group =
        new THREE.Group();

    group.userData.playerId =
        p.id;

    const teamMaterial =
        new THREE.MeshStandardMaterial({
            color:
                p.team==="a"
                    ? 0x287dff
                    : 0xff3434
        });

    const body =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .7,1.2,.45
            ),
            teamMaterial
        );

    body.position.y=.8;

    group.add(body);

    const head =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .27,
                10,
                10
            ),
            new THREE.MeshStandardMaterial({
                color:0xb98562
            })
        );

    head.position.y=1.65;

    group.add(head);

    group.position.set(
        p.x,
        0,
        p.z
    );

    scene.add(group);

    otherPlayers.set(
        p.id,
        group
    );
}


function updateOtherPlayers(list){

    const seen =
        new Set();

    for(const p of list){

        if(p.id===myId)
            continue;

        seen.add(p.id);

        if(!otherPlayers.has(p.id)){

            createOtherPlayer(p);

        }else{

            const obj =
                otherPlayers.get(p.id);

            obj.position.lerp(
                new THREE.Vector3(
                    p.x,
                    0,
                    p.z
                ),
                .35
            );

            obj.rotation.y =
                p.rot || 0;
        }
    }

    for(
        const [id,obj]
        of otherPlayers
    ){

        if(!seen.has(id)){

            scene.remove(obj);

            otherPlayers.delete(id);
        }
    }
}


/* =====================================================
   SERVER
===================================================== */

function connect(){

    const protocol =
        location.protocol==="https:"
            ? "wss"
            : "ws";

    socket =
        new WebSocket(
            `${protocol}://${location.host}`
        );

    socket.onmessage =
        event=>{

            const data =
                JSON.parse(
                    event.data
                );

            if(data.type==="welcome"){

                myId=data.id;
            }

            if(data.type==="state"){

                updateOtherPlayers(
                    data.players
                );

                const me =
                    data.players.find(
                        p=>p.id===myId
                    );

                if(me)
                    updateHealth(me.hp);
            }

            if(data.type==="round"){

                document.getElementById(
                    "score"
                ).innerHTML =
                    `<span class="blue">BLUE ${data.you}</span>
                    &nbsp;:&nbsp;
                    <span class="red">${data.enemy} RED</span>`;
            }
        };

    socket.onclose =
        ()=>{
            setTimeout(
                connect,
                3000
            );
        };
}

connect();

function updateHealth(hp){

    hp =

/* =====================================================
   MOVEMENT
===================================================== */

function move(){

    const dt =
        Math.min(
            clock.getDelta(),
            .05
        );

    let speed =
        keys.ShiftLeft ||
        keys.ShiftRight
            ? 10
            : 6;

    if(
        keys.ControlLeft ||
        keys.ControlRight
    )
        speed=3;

    const forward =
        new THREE.Vector3(
            Math.sin(yaw),
            0,
            Math.cos(yaw)
        );

    const right =
        new THREE.Vector3(
            Math.cos(yaw),
            0,
            -Math.sin(yaw)
        );

    if(keys.KeyW)
        player.position.addScaledVector(
            forward,
            -speed*dt
        );

    if(keys.KeyS)
        player.position.addScaledVector(
            forward,
            speed*dt
        );

    if(keys.KeyA)
        player.position.addScaledVector(
            right,
            -speed*dt
        );

    if(keys.KeyD)
        player.position.addScaledVector(
            right,
            speed*dt
        );

    player.position.x =
        THREE.MathUtils.clamp(
            player.position.x,
            -90,
            90
        );

    player.position.z =
        THREE.MathUtils.clamp(
            player.position.z,
            -90,
            90
        );

    camera.position.y=1.7;

    camera.rotation.order="YXZ";

    camera.rotation.y=yaw;
    camera.rotation.x=pitch;
}

   SETTINGS APPLY
===================================================== */

function applySettings(){

    /* pixel quality */

    if(settings.graphics==="low"){

        renderer.setPixelRatio(1);

        sun.intensity=2.5;

        scene.fog.far =
            settings.distance==="low"
                ? 150
                : 220;

    }

    if(settings.graphics==="medium"){

        renderer.setPixelRatio(
            Math.min(
                devicePixelRatio,
                1.25
            )
        );

        sun.intensity=3;

        scene.fog.far =
            settings.distance==="high"
                ? 380
                : 280;
    }

    if(settings.graphics==="high"){

        renderer.setPixelRatio(
            Math.min(
                devicePixelRatio,
                1.5
            )
        );

        sun.intensity=3.2;

        scene.fog.far=450;
    }

    renderer.shadowMap.enabled =
        settings.shadows &&
        settings.graphics!=="low";
}


/* =====================================================
   FPS
===================================================== */

let frameCount=0;
let fpsTime=performance.now();

function updateFPS(){

    frameCount++;

    const now =
        performance.now();

    if(now-fpsTime>=1000){

        const fps =
            Math.round(
                frameCount/
                ((now-fpsTime)/1000)
            );

        document.getElementById(
            "fps"
        ).textContent =
            "FPS: "+fps;

        frameCount=0;
        fpsTime=now;
    }
}


/* =====================================================
   GAME LOOP
===================================================== */

const clock =
    new THREE.Clock();

let gameStarted=false;

let lastFrame=0;

function animate(time){

    requestAnimationFrame(
        animate
    );

    const limit =
        settings.fps;

    if(limit>0){

        const interval =
            1000/limit;

        if(
            time-lastFrame<
            interval
        )
            return;

        lastFrame=time;
    }

    if(gameStarted){

        move();
        updateWeapon();
        updateFPS();
    }

    renderer.render(
        scene,
        camera
    );
}

applySettings();

requestAnimationFrame(
    animate
);
