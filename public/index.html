<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tactical Desert</title>

<style>
*{
    box-sizing:border-box;
    user-select:none;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
}

#menu{
    position:fixed;
    inset:0;
    z-index:20;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at center,#5e513f 0%,#211d18 45%,#090909 100%);
    color:white;
}

#menu h1{
    margin:0 0 8px;
    font-size:54px;
    letter-spacing:5px;
    text-shadow:0 4px 15px #000;
}

#menu p{
    margin:0 0 35px;
    color:#bbb;
}

button{
    width:260px;
    padding:15px;
    margin:7px;
    border:1px solid #777;
    background:#171717;
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#333;
}

#settings{
    position:fixed;
    inset:0;
    z-index:30;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.82);
    color:white;
}

.panel{
    width:420px;
    max-width:90%;
    background:#171717;
    border:1px solid #555;
    padding:28px;
    box-shadow:0 15px 50px #000;
}

.panel h2{
    margin-top:0;
}

.setting{
    margin:20px 0;
}

.setting label{
    display:block;
    margin-bottom:8px;
    color:#bbb;
}

.setting button{
    width:auto;
    padding:9px 13px;
    margin:2px;
    font-size:13px;
}

.selected{
    background:#c48b3b !important;
    color:#fff;
}

#hud{
    position:fixed;
    inset:0;
    z-index:10;
    pointer-events:none;
    display:none;
    color:white;
}

#crosshair{
    position:absolute;
    left:50%;
    top:50%;
    width:20px;
    height:20px;
    transform:translate(-50%,-50%);
}

#crosshair:before,
#crosshair:after{
    content:"";
    position:absolute;
    background:white;
}

#crosshair:before{
    width:2px;
    height:20px;
    left:9px;
    top:0;
}

#crosshair:after{
    width:20px;
    height:2px;
    left:0;
    top:9px;
}

#stats{
    position:absolute;
    left:20px;
    bottom:18px;
    font-size:22px;
    text-shadow:2px 2px 4px #000;
}

#ammo{
    position:absolute;
    right:25px;
    bottom:18px;
    font-size:30px;
    text-shadow:2px 2px 4px #000;
}

#top{
    position:absolute;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    text-align:center;
    text-shadow:2px 2px 4px #000;
}

#fps{
    position:absolute;
    right:15px;
    top:15px;
    font-size:14px;
    color:#ddd;
}

#location{
    position:absolute;
    bottom:80px;
    left:50%;
    transform:translateX(-50%);
    font-size:16px;
    color:#ddd;
    text-shadow:2px 2px 4px #000;
}

#damage{
    position:absolute;
    inset:0;
    border:0 solid rgba(255,0,0,.7);
    pointer-events:none;
}

#weapon{
    position:absolute;
    right:5%;
    bottom:-5%;
    width:400px;
    height:310px;
    transform-origin:80% 80%;
}

.gun{
    position:absolute;
    background:#181818;
    box-shadow:inset 0 0 4px #555;
}

#gunBody{
    width:230px;
    height:65px;
    right:70px;
    top:80px;
    transform:rotate(-7deg);
}

#receiver{
    width:120px;
    height:48px;
    right:190px;
    top:70px;
    transform:rotate(-7deg);
}

#barrel{
    width:170px;
    height:16px;
    right:0;
    top:93px;
    transform:rotate(-7deg);
}

#mag{
    width:48px;
    height:115px;
    right:170px;
    top:125px;
    transform:rotate(12deg);
}

#grip{
    width:45px;
    height:90px;
    right:125px;
    top:130px;
    transform:rotate(-12deg);
}

#stock{
    width:95px;
    height:48px;
    right:275px;
    top:75px;
    transform:rotate(-15deg);
}

#sight{
    width:45px;
    height:10px;
    right:245px;
    top:55px;
}

.hand{
    position:absolute;
    width:90px;
    height:115px;
    background:#b9855b;
    border-radius:30px;
    box-shadow:inset 0 0 10px rgba(0,0,0,.35);
}

#hand1{
    right:175px;
    top:145px;
    transform:rotate(-25deg);
}

#hand2{
    right:60px;
    top:125px;
    transform:rotate(-50deg);
}

.glove{
    position:absolute;
    inset:10px;
    background:#252525;
    border-radius:25px;
}

#flash{
    position:absolute;
    right:0;
    top:76px;
    width:65px;
    height:65px;
    background:#ffd36b;
    clip-path:polygon(
        50% 0,
        65% 35%,
        100% 50%,
        65% 65%,
        50% 100%,
        35% 65%,
        0 50%,
        35% 35%
    );
    display:none;
}

#reloadText{
    position:absolute;
    left:50%;
    bottom:15%;
    transform:translateX(-50%);
    font-size:18px;
    display:none;
}
</style>
</head>

<body>

<div id="menu">
    <h1>TACTICAL DESERT</h1>
    <p>Multiplayer Tactical FPS</p>
    <button id="play">PLAY</button>
    <button id="openSettings">SETTINGS</button>
</div>

<div id="settings">
    <div class="panel">
        <h2>SETTINGS</h2>

        <div class="setting">
            <label>Graphics</label>
            <button data-graphics="low">LOW</button>
            <button data-graphics="medium">MEDIUM</button>
            <button data-graphics="high">HIGH</button>
        </div>

        <div class="setting">
            <label>FPS limit</label>
            <button data-fps="30">30</button>
            <button data-fps="60">60</button>
            <button data-fps="120">120</button>
            <button data-fps="0">UNLIMITED</button>
        </div>

        <div class="setting">
            <label>Shadows</label>
            <button data-shadows="false">OFF</button>
            <button data-shadows="true">ON</button>
        </div>

        <div class="setting">
            <label>View distance</label>
            <button data-distance="low">LOW</button>
            <button data-distance="medium">MEDIUM</button>
            <button data-distance="high">HIGH</button>
        </div>

        <button id="closeSettings">BACK</button>
    </div>
</div>

<div id="hud">
    <div id="crosshair"></div>

    <div id="top">
        <b id="score">A 0 : 0 B</b>
    </div>

    <div id="fps">FPS: 0</div>

    <div id="stats">
        HP: <span id="hp">100</span>
    </div>

    <div id="ammo">
        <span id="magAmmo">30</span> / 90
    </div>

    <div id="location">MID</div>

    <div id="damage"></div>

    <div id="reloadText">RELOADING...</div>

    <div id="weapon">
        <div id="flash"></div>
        <div id="stock" class="gun"></div>
        <div id="receiver" class="gun"></div>
        <div id="gunBody" class="gun"></div>
        <div id="barrel" class="gun"></div>
        <div id="mag" class="gun"></div>
        <div id="grip" class="gun"></div>
        <div id="sight" class="gun"></div>

        <div id="hand1" class="hand">
            <div class="glove"></div>
        </div>

        <div id="hand2" class="hand">
            <div class="glove"></div>
        </div>
    </div>
</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

/* =========================
   SETTINGS
========================= */

let settings = {
    graphics:"low",
    fps:60,
    shadows:false,
    distance:"medium"
};

try{
    const saved =
        JSON.parse(localStorage.getItem("tacticalSettings"));

    if(saved){
        settings = {...settings,...saved};
    }
}catch(e){}

function saveSettings(){
    localStorage.setItem(
        "tacticalSettings",
        JSON.stringify(settings)
    );
}

/* =========================
   THREE
========================= */

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0xb99461);

scene.fog =
    new THREE.Fog(0xb99461,120,550);

const camera =
    new THREE.PerspectiveCamera(
        75,
        innerWidth/innerHeight,
        .05,
        700
    );

const renderer =
    new THREE.WebGLRenderer({
        antialias:false,
        powerPreference:"high-performance"
    });

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(1);

document.body.appendChild(renderer.domElement);

/* =========================
   LIGHT
========================= */

const sun =
    new THREE.DirectionalLight(
        0xffe0ad,
        2.2
    );

sun.position.set(
    -150,
    250,
    100
);

scene.add(sun);

scene.add(
    new THREE.HemisphereLight(
        0xffd7a1,
        0x554433,
        1.2
    )
);

/* =========================
   MATERIALS
========================= */

const mats = {

    sand:
        new THREE.MeshLambertMaterial({
            color:0xc99b61
        }),

    sandDark:
        new THREE.MeshLambertMaterial({
            color:0xa87948
        }),

    wall:
        new THREE.MeshLambertMaterial({
            color:0xb27d4e
        }),

    wallLight:
        new THREE.MeshLambertMaterial({
            color:0xd0a06a
        }),

    dark:
        new THREE.MeshLambertMaterial({
            color:0x574333
        }),

    wood:
        new THREE.MeshLambertMaterial({
            color:0x744523
        }),

    metal:
        new THREE.MeshLambertMaterial({
            color:0x464646
        }),

    green:
        new THREE.MeshLambertMaterial({
            color:0x596044
        })
};

/* =========================
   HELPERS
========================= */

function box(
    x,
    y,
    z,
    sx,
    sy,
    sz,
    material,
    rot=0
){

    const mesh =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                sx,
                sy,
                sz
            ),
            material
        );

    mesh.position.set(
        x,y,z
    );

    mesh.rotation.y =
        rot;

    scene.add(mesh);

    return mesh;
}

function cylinder(
    x,
    y,
    z,
    radius,
    height,
    material
){

    const mesh =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                radius,
                radius,
                height,
                8
            ),
            material
        );

    mesh.position.set(
        x,y,z
    );

    scene.add(mesh);

    return mesh;
}

/* =========================
   GROUND
========================= */

box(
    0,
    -2,
    0,
    620,
    4,
    620,
    mats.sand
);

/* =========================
   MAP BOUNDARY
========================= */

box(
    0,
    20,
    -300,
    620,
    40,
    5,
    mats.wall
);

box(
    0,
    20,
    300,
    620,
    40,
    5,
    mats.wall
);

box(
    -300,
    20,
    0,
    5,
    40,
    600,
    mats.wall
);

box(
    300,
    20,
    0,
    5,
    40,
    600,
    mats.wall
);

/* =========================
   BUILDING
========================= */

function building(
    x,
    z,
    w,
    d,
    h=20
){

    box(
        x,
        h/2,
        z,
        w,
        h,
        d,
        mats.wall
    );

    /* roof */

    box(
        x,
        h+.5,
        z,
        w+1,
        1,
        d+1,
        mats.wallLight
    );

    /* doorway */

    box(
        x-w*.25,
        5,
        z-d/2-.4,
        5,
        10,
        1,
        mats.dark
    );

    /* windows */

    for(
        let i=-1;
        i<=1;
        i++
    ){

        box(
            x+i*w*.25,
            h*.58,
            z-d/2-.55,
            3,
            3,
            .3,
            mats.dark
        );
    }
}

/* =========================
   A SITE
========================= */

building(
    -220,
    -190,
    95,
    70,
    25
);

building(
    -125,
    -205,
    55,
    90,
    22
);

building(
    -235,
    -80,
    70,
    55,
    20
);

building(
    -150,
    -60,
    65,
    45,
    18
);

/* =========================
   B SITE
========================= */

building(
    215,
    190,
    95,
    70,
    25
);

building(
    125,
    205,
    55,
    90,
    22
);

building(
    235,
    80,
    70,
    55,
    20
);

building(
    150,
    60,
    65,
    45,
    18
);

/* =========================
   LONG
========================= */

box(
    -45,
    8,
    -175,
    20,
    16,
    240,
    mats.wall
);

box(
    45,
    8,
    -175,
    20,
    16,
    240,
    mats.wall
);

/* long cover */

for(
    let z=-250;
    z<0;
    z+=45
){

    box(
        0,
        3,
        z,
        12,
        6,
        16,
        mats.sandDark
    );
}

/* =========================
   MID
========================= */

box(
    -95,
    7,
    30,
    20,
    14,
    130,
    mats.wall
);

box(
    95,
    7,
    30,
    20,
    14,
    130,
    mats.wall
);

/* mid covers */

for(
    let x=-65;
    x<=65;
    x+=32
){

    box(
        x,
        4,
        25,
        14,
        8,
        12,
        mats.sandDark
    );
}

/* =========================
   SHORT
========================= */

box(
    -150,
    6,
    100,
    14,
    12,
    110,
    mats.wallLight
);

box(
    150,
    6,
    100,
    14,
    12,
    110,
    mats.wallLight
);

/* =========================
   TUNNELS
========================= */

function tunnel(
    x,
    z,
    length
){

    box(
        x-10,
        8,
        z,
        20,
        16,
        length,
        mats.dark
    );

    box(
        x+10,
        8,
        z,
        20,
        16,
        length,
        mats.dark
    );

    box(
        x,
        17,
        z,
        40,
        3,
        length,
        mats.wall
    );
}

tunnel(
    -80,
    145,
    120
);

tunnel(
    80,
    -145,
    120
);

/* =========================
   SIDE ALLEYS
========================= */

for(
    let z=-240;
    z<=240;
    z+=60
){

    box(
        -275,
        4,
        z,
        25,
        8,
        35,
        mats.wall
    );

    box(
        275,
        4,
        z,
        25,
        8,
        35,
        mats.wall
    );
}

/* =========================
   CRATES
========================= */

for(
    let i=0;
    i<45;
    i++
){

    const x =
        Math.round(
            (Math.random()*430-215)/10
        )*10;

    const z =
        Math.round(
            (Math.random()*430-215)/10
        )*10;

    if(
        Math.abs(x)<35 &&
        Math.abs(z)<35
    ) continue;

    box(
        x,
        3,
        z,
        7,
        6,
        7,
        mats.wood,
        Math.random()*3
    );
}

/* =========================
   BARRELS
========================= */

for(
    let i=0;
    i<25;
    i++
){

    const x =
        Math.random()*440-220;

    const z =
        Math.random()*440-220;

    cylinder(
        x,
        4,
        z,
        3,
        8,
        mats.metal
    );
}

/* =========================
   PALMS
========================= */

function palm(x,z){

    cylinder(
        x,
        8,
        z,
        1.5,
        16,
        mats.wood
    );

    if(settings.graphics==="low")
        return;

    for(
        let i=0;
        i<6;
        i++
    ){

        const leaf =
            box(
                x,
                16,
                z,
                2,
                1,
                12,
                mats.green,
                i*Math.PI/3
            );
    }
}

for(
    let i=0;
    i<18;
    i++
){

    palm(
        Math.random()*500-250,
        Math.random()*500-250
    );
}

/* =========================
   SPAWN AREAS
========================= */

box(
    -235,
    .2,
    -245,
    45,
    .4,
    35,
    mats.sandDark
);

box(
    235,
    .2,
    245,
    45,
    .4,
    35,
    mats.sandDark
);

/* =========================
   PLAYER
========================= */

const player =
    new THREE.Object3D();

scene.add(player);

player.position.set(
    -235,
    0,
    -245
);

player.add(camera);

camera.position.set(
    0,
    1.7,
    0
);

let yaw=0;
let pitch=0;

let keys={};

let speed=7;

document.addEventListener(
    "keydown",
    e=>{
        keys[e.code]=true;

        if(
            e.code==="KeyR" &&
            !reloading
        ){
            reload();
        }
    }
);

document.addEventListener(
    "keyup",
    e=>{
        keys[e.code]=false;
    }
);

/* =========================
   MOUSE LOOK
========================= */

document.addEventListener(
    "mousemove",
    e=>{

        if(
            document.pointerLockElement !==
            document.body
        ) return;

        yaw -= e.movementX*.002;
        pitch -= e.movementY*.002;

        pitch =
            Math.max(
                -1.45,
                Math.min(
                    1.45,
                    pitch
                )
            );

        player.rotation.y=yaw;

        camera.rotation.x=pitch;
    }
);

/* =========================
   MOVEMENT
========================= */

const clock =
    new THREE.Clock();

function move(){

    const dt =
        Math.min(
            clock.getDelta(),
            .05
        );

    let velocity=speed;

    if(keys.ShiftLeft)
        velocity=11;

    if(keys.ControlLeft)
        velocity=4;

    const forward =
        new THREE.Vector3(
            0,
            0,
            -1
        );

    const right =
        new THREE.Vector3(
            1,
            0,
            0
        );

    forward.applyQuaternion(
        player.quaternion
    );

    right.applyQuaternion(
        player.quaternion
    );

    if(keys.KeyW)
        player.position.addScaledVector(
            forward,
            velocity*dt
        );

    if(keys.KeyS)
        player.position.addScaledVector(
            forward,
            -velocity*dt
        );

    if(keys.KeyA)
        player.position.addScaledVector(
            right,
            -velocity*dt
        );

    if(keys.KeyD)
        player.position.addScaledVector(
            right,
            velocity*dt
        );

    player.position.x =
        THREE.MathUtils.clamp(
            player.position.x,
            -285,
            285
        );

    player.position.z =
        THREE.MathUtils.clamp(
            player.position.z,
            -285,
            285
        );

    updateLocation();
}

/* =========================
   LOCATION
========================= */

function updateLocation(){

    const x=player.position.x;
    const z=player.position.z;

    let loc="MID";

    if(
        z < -130 &&
        x < -120
    )
        loc="A LONG";

    else if(
        z > 130 &&
        x > 120
    )
        loc="B SITE";

    else if(
        Math.abs(x)<60 &&
        Math.abs(z)>120
    )
        loc="LONG";

    else if(
        Math.abs(x)>130 &&
        Math.abs(z)<130
    )
        loc="SHORT";

    else if(
        Math.abs(x)<100 &&
        Math.abs(z)<100
    )
        loc="MID";

    else if(
        x<0
    )
        loc="A SIDE";

    else
        loc="B SIDE";

    document.getElementById(
        "location"
    ).textContent=loc;
}

/* =========================
   WEAPON
========================= */

let ammo=30;
let reloading=false;
let lastShot=0;

const flash =
    document.getElementById(
        "flash"
    );

function shoot(){

    if(reloading)
        return;

    if(ammo<=0){
        reload();
        return;
    }

    const now=performance.now();

    if(
        now-lastShot<110
    ) return;

    lastShot=now;

    ammo--;

    document.getElementById(
        "magAmmo"
    ).textContent=ammo;

    flash.style.display="block";

    setTimeout(()=>{
        flash.style.display="none";
    },45);

    const weapon =
        document.getElementById(
            "weapon"
        );

    weapon.animate(
        [
            {
                transform:"translate(0,0)"
            },
            {
                transform:"translate(-12px,8px) rotate(-2deg)"
            },
            {
                transform:"translate(0,0)"
            }
        ],
        {
            duration:100,
            easing:"ease-out"
        }
    );

    /* ray */

    const ray =
        new THREE.Raycaster();

    ray.setFromCamera(
        new THREE.Vector2(0,0),
        camera
    );

    const hits =
        ray.intersectObjects(
            scene.children,
            true
        );

    if(hits.length){

        const object=
            hits.find(
                h =>
                    h.object !==
                    player
            );

        if(object){

            document.getElementById(
                "damage"
            ).style.borderWidth="5px";

            setTimeout(()=>{
                document.getElementById(
                    "damage"
                ).style.borderWidth="0";
            },70);
        }
    }
}

document.addEventListener(
    "mousedown",
    e=>{

        if(
            e.button===0 &&
            gameRunning
        ){
            shoot();
        }
    }
);

/* =========================
   RELOAD
========================= */

function reload(){

    if(reloading)
        return;

    if(ammo===30)
        return;

    reloading=true;

    document.getElementById(
        "reloadText"
    ).style.display="block";

    const weapon =
        document.getElementById(
            "weapon"
        );

    weapon.animate(
        [
            {
                transform:"rotate(0)"
            },
            {
                transform:"rotate(12deg) translateY(30px)"
            },
            {
                transform:"rotate(-10deg)"
            },
            {
                transform:"rotate(0)"
            }
        ],
        {
            duration:1300
        }
    );

    setTimeout(()=>{

        ammo=30;

        document.getElementById(
            "magAmmo"
        ).textContent=ammo;

        document.getElementById(
            "reloadText"
        ).style.display="none";

        reloading=false;

    },1300);
}

/* =========================
   SETTINGS
========================= */

function applySettings(){

    if(
        settings.graphics==="low"
    ){

        renderer.setPixelRatio(1);

        sun.intensity=1.7;

    }

    if(
        settings.graphics==="medium"
    ){

        renderer.setPixelRatio(
            Math.min(
                devicePixelRatio,
                1.25
            )
        );

        sun.intensity=2;

    }

    if(
        settings.graphics==="high"
    ){

        renderer.setPixelRatio(
            Math.min(
                devicePixelRatio,
                1.6
            )
        );

        sun.intensity=2.2;

    }

    if(
        settings.distance==="low"
    ){

        scene.fog.near=70;
        scene.fog.far=260;

    }

    if(
        settings.distance==="medium"
    ){

        scene.fog.near=120;
        scene.fog.far=430;

    }

    if(
        settings.distance==="high"
    ){

        scene.fog.near=180;
        scene.fog.far=650;

    }

    sun.castShadow=
        settings.shadows;

    saveSettings();

    updateButtons();
}

function updateButtons(){

    document
        .querySelectorAll(
            "[data-graphics]"
        )
        .forEach(b=>{
            b.classList.toggle(
                "selected",
                b.dataset.graphics===
                settings.graphics
            );
        });

    document
        .querySelectorAll(
            "[data-fps]"
        )
        .forEach(b=>{
            b.classList.toggle(
                "selected",
                Number(b.dataset.fps)===
                settings.fps
            );
        });

    document
        .querySelectorAll(
            "[data-shadows]"
        )
        .forEach(b=>{
            b.classList.toggle(
                "selected",
                String(settings.shadows)===
                b.dataset.shadows
            );
        });

    document
        .querySelectorAll(
            "[data-distance]"
        )
        .forEach(b=>{
            b.classList.toggle(
                "selected",
                b.dataset.distance===
                settings.distance
            );
        });
}

document
    .querySelectorAll(
        "[data-graphics]"
    )
    .forEach(b=>{

        b.onclick=()=>{

            settings.graphics=
                b.dataset.graphics;

            applySettings();
        };
    });

document
    .querySelectorAll(
        "[data-fps]"
    )
    .forEach(b=>{

        b.onclick=()=>{

            settings.fps=
                Number(b.dataset.fps);

            applySettings();
        };
    });

document
    .querySelectorAll(
        "[data-shadows]"
    )
    .forEach(b=>{

        b.onclick=()=>{

            settings.shadows=
                b.dataset.shadows==="true";

            applySettings();
        };
    });

document
    .querySelectorAll(
        "[data-distance]"
    )
    .forEach(b=>{

        b.onclick=()=>{

            settings.distance=
                b.dataset.distance;

            applySettings();
        };
    });

document.getElementById(
    "openSettings"
).onclick=()=>{

    document.getElementById(
        "settings"
    ).style.display="flex";

    updateButtons();
};

document.getElementById(
    "closeSettings"
).onclick=()=>{

    document.getElementById(
        "settings"
    ).style.display="none";
};

/* =========================
   GAME
========================= */

let gameRunning=false;

document.getElementById(
    "play"
).onclick=()=>{

    gameRunning=true;

    document.getElementById(
        "menu"
    ).style.display="none";

    document.getElementById(
        "hud"
    ).style.display="block";

    renderer.domElement.requestPointerLock();

    player.position.set(
        -235,
        0,
        -245
    );
};

/* ESC */

document.addEventListener(
    "pointerlockchange",
    ()=>{

        if(
            document.pointerLockElement !==
            document.body &&
            gameRunning
        ){

            gameRunning=false;

            document.getElementById(
                "menu"
            ).style.display="flex";

            document.getElementById(
                "hud"
            ).style.display="none";
        }
    }
);

/* =========================
   FPS
========================= */

let frames=0;
let fpsTime=performance.now();

function updateFPS(){

    frames++;

    const now=performance.now();

    if(
        now-fpsTime>=1000
    ){

        document.getElementById(
            "fps"
        ).textContent=
            "FPS: "+frames;

        frames=0;
        fpsTime=now;
    }
}

/* =========================
   RENDER LOOP
========================= */

let lastFrame=0;

function animate(time){

    requestAnimationFrame(
        animate
    );

    if(
        settings.fps>0
    ){

        const interval=
            1000/settings.fps;

        if(
            time-lastFrame<
            interval
        )
            return;

        lastFrame=time;
    }

    if(gameRunning)
        move();

    updateFPS();

    renderer.render(
        scene,
        camera
    );
}

applySettings();

animate(0);

/* =========================
   RESIZE
========================= */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);

</script>
</body>
</html>
