<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tactical Desert</title>

<style>
*{
    box-sizing:border-box;
    user-select:none;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    font-family:Arial,Helvetica,sans-serif;
}

canvas{
    display:block;
}

#menu{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:
        linear-gradient(
            rgba(0,0,0,.35),
            rgba(0,0,0,.8)
        ),
        radial-gradient(
            circle,
            #9c7346,
            #211a14 75%
        );
    color:white;
}

#menu h1{
    font-size:58px;
    letter-spacing:7px;
    margin:0;
    text-shadow:0 6px 20px #000;
}

#menu p{
    color:#ccc;
    margin:10px 0 35px;
}

.menuButton{
    width:280px;
    padding:16px;
    margin:6px;
    border:1px solid #777;
    background:#181818;
    color:white;
    font-size:18px;
    cursor:pointer;
}

.menuButton:hover{
    background:#383838;
}

#settings{
    position:fixed;
    inset:0;
    z-index:200;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.85);
}

.panel{
    width:430px;
    max-width:92%;
    padding:28px;
    background:#181818;
    border:1px solid #555;
    color:white;
    box-shadow:0 20px 70px #000;
}

.panel h2{
    margin-top:0;
}

.setting{
    margin:20px 0;
}

.setting label{
    display:block;
    margin-bottom:8px;
    color:#aaa;
}

.setting button{
    padding:9px 13px;
    margin:2px;
    border:1px solid #555;
    background:#242424;
    color:white;
    cursor:pointer;
}

.setting button:hover,
.setting button.selected{
    background:#b2783d;
}

#hud{
    position:fixed;
    inset:0;
    z-index:50;
    pointer-events:none;
    display:none;
    color:white;
}

#crosshair{
    position:absolute;
    left:50%;
    top:50%;
    width:18px;
    height:18px;
    transform:translate(-50%,-50%);
}

#crosshair span{
    position:absolute;
    background:white;
    box-shadow:0 0 2px #000;
}

#crosshair .v{
    width:2px;
    height:18px;
    left:8px;
    top:0;
}

#crosshair .h{
    width:18px;
    height:2px;
    left:0;
    top:8px;
}

#bottomLeft{
    position:absolute;
    bottom:20px;
    left:22px;
    font-size:24px;
    text-shadow:2px 2px 5px #000;
}

#ammo{
    position:absolute;
    bottom:20px;
    right:25px;
    font-size:30px;
    text-shadow:2px 2px 5px #000;
}

#top{
    position:absolute;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    font-size:19px;
    text-shadow:2px 2px 5px #000;
}

#fps{
    position:absolute;
    top:12px;
    right:15px;
    font-size:13px;
    color:#ddd;
}

#location{
    position:absolute;
    bottom:72px;
    left:50%;
    transform:translateX(-50%);
    font-size:14px;
    text-shadow:2px 2px 5px #000;
}

#reload{
    position:absolute;
    left:50%;
    bottom:18%;
    transform:translateX(-50%);
    font-size:18px;
    display:none;
    text-shadow:2px 2px 5px #000;
}

/* =========================
   WEAPON
========================= */

#weapon{
    position:absolute;
    right:3%;
    bottom:-5%;
    width:470px;
    height:370px;
    transform-origin:85% 90%;
    filter:drop-shadow(0 12px 10px rgba(0,0,0,.6));
}

.warm{
    position:absolute;
    background:linear-gradient(
        120deg,
        #242424,
        #111
    );
}

#rifleReceiver{
    width:245px;
    height:74px;
    right:95px;
    top:82px;
    transform:rotate(-7deg);
    border-radius:5px 12px 8px 5px;
}

#rifleTop{
    width:190px;
    height:13px;
    right:122px;
    top:68px;
    transform:rotate(-7deg);
    border-radius:5px;
}

#rifleBarrel{
    width:155px;
    height:18px;
    right:-8px;
    top:98px;
    transform:rotate(-7deg);
    border-radius:0 10px 10px 0;
}

#rifleMuzzle{
    width:24px;
    height:25px;
    right:-18px;
    top:95px;
    transform:rotate(-7deg);
    background:#0c0c0c;
}

#rifleHandguard{
    width:155px;
    height:45px;
    right:4px;
    top:105px;
    transform:rotate(-7deg);
    background:
        repeating-linear-gradient(
            90deg,
            #1b1b1b 0 9px,
            #303030 10px 12px
        );
}

#rifleMagazine{
    width:49px;
    height:130px;
    right:188px;
    top:135px;
    transform:rotate(12deg);
    border-radius:3px 3px 8px 8px;
}

#rifleGrip{
    width:48px;
    height:92px;
    right:120px;
    top:137px;
    transform:rotate(-13deg);
    border-radius:4px 4px 15px 15px;
}

#rifleStock{
    width:120px;
    height:58px;
    right:315px;
    top:74px;
    transform:rotate(-11deg);
    border-radius:10px 2px 2px 10px;
}

#rifleSight{
    width:50px;
    height:12px;
    right:242px;
    top:54px;
    background:#111;
}

.hand{
    position:absolute;
    background:#b8784d;
    border-radius:35px;
    box-shadow:
        inset -8px -8px 12px rgba(0,0,0,.25);
}

.hand:after{
    content:"";
    position:absolute;
    inset:9px;
    background:
        linear-gradient(
            135deg,
            #292929,
            #111
        );
    border-radius:25px;
}

#handLeft{
    width:104px;
    height:125px;
    right:194px;
    top:164px;
    transform:rotate(-27deg);
}

#handRight{
    width:110px;
    height:130px;
    right:62px;
    top:143px;
    transform:rotate(-46deg);
}

#sleeveLeft{
    position:absolute;
    width:105px;
    height:145px;
    right:270px;
    top:225px;
    background:#242525;
    transform:rotate(-20deg);
    border-radius:20px;
}

#sleeveRight{
    position:absolute;
    width:110px;
    height:145px;
    right:5px;
    top:220px;
    background:#242525;
    transform:rotate(-40deg);
    border-radius:20px;
}

#flash{
    position:absolute;
    right:-60px;
    top:72px;
    width:100px;
    height:100px;
    display:none;
    background:
        radial-gradient(
            circle,
            white 0 12%,
            #ffe47a 20%,
            #ff9d24 45%,
            transparent 70%
        );
}

/* ========================= */

#hitmarker{
    position:absolute;
    left:50%;
    top:50%;
    width:35px;
    height:35px;
    transform:translate(-50%,-50%);
    display:none;
}

#hitmarker:before,
#hitmarker:after{
    content:"";
    position:absolute;
    inset:8px;
    border:2px solid white;
}

#hitmarker:before{
    transform:rotate(45deg);
}

#hitmarker:after{
    transform:rotate(-45deg);
}
</style>
</head>

<body>

<div id="menu">
    <h1>TACTICAL DESERT</h1>
    <p>TACTICAL FPS</p>

    <button class="menuButton" id="play">
        PLAY
    </button>

    <button class="menuButton" id="settingsButton">
        SETTINGS
    </button>
</div>

<div id="settings">

    <div class="panel">

        <h2>SETTINGS</h2>

        <div class="setting">
            <label>Graphics</label>

            <button data-g="low">LOW</button>
            <button data-g="medium">MEDIUM</button>
            <button data-g="high">HIGH</button>
        </div>

        <div class="setting">
            <label>FPS LIMIT</label>

            <button data-fps="30">30</button>
            <button data-fps="60">60</button>
            <button data-fps="120">120</button>
            <button data-fps="0">UNLIMITED</button>
        </div>

        <div class="setting">
            <label>SHADOWS</label>

            <button data-shadow="0">OFF</button>
            <button data-shadow="1">ON</button>
        </div>

        <div class="setting">
            <label>VIEW DISTANCE</label>

            <button data-distance="low">LOW</button>
            <button data-distance="medium">MEDIUM</button>
            <button data-distance="high">HIGH</button>
        </div>

        <button
            class="menuButton"
            id="closeSettings">
            BACK
        </button>

    </div>

</div>

<div id="hud">

    <div id="crosshair">
        <span class="v"></span>
        <span class="h"></span>
    </div>

    <div id="hitmarker"></div>

    <div id="top">
        <b id="score">A 0 : 0 B</b>
    </div>

    <div id="fps">
        FPS: 0
    </div>

    <div id="bottomLeft">
        HP: <span id="hp">100</span>
    </div>

    <div id="ammo">
        <span id="ammoNumber">30</span> / 90
    </div>

    <div id="location">
        MID
    </div>

    <div id="reload">
        RELOADING...
    </div>

    <div id="weapon">

        <div id="flash"></div>

        <div
            id="sleeveLeft">
        </div>

        <div
            id="sleeveRight">
        </div>

        <div
            id="rifleStock"
            class="warm">
        </div>

        <div
            id="rifleReceiver"
            class="warm">
        </div>

        <div
            id="rifleTop"
            class="warm">
        </div>

        <div
            id="rifleHandguard"
            class="warm">
        </div>

        <div
            id="rifleBarrel"
            class="warm">
        </div>

        <div
            id="rifleMuzzle"
            class="warm">
        </div>

        <div
            id="rifleMagazine"
            class="warm">
        </div>

        <div
            id="rifleGrip"
            class="warm">
        </div>

        <div
            id="rifleSight"
            class="warm">
        </div>

        <div
            id="handLeft"
            class="hand">
        </div>

        <div
            id="handRight"
            class="hand">
        </div>

    </div>

</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

/* =========================================================
   SETTINGS
========================================================= */

let settings = {
    graphics:"low",
    fps:60,
    shadows:false,
    distance:"medium"
};

try{

    const saved =
        JSON.parse(
            localStorage.getItem(
                "tacticalSettings"
            )
        );

    if(saved)
        settings={
            ...settings,
            ...saved
        };

}catch(e){}

function saveSettings(){

    localStorage.setItem(
        "tacticalSettings",
        JSON.stringify(settings)
    );
}

/* =========================================================
   SCENE
========================================================= */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(
        0xb9915c
    );

const camera =
    new THREE.PerspectiveCamera(
        75,
        innerWidth / innerHeight,
        .05,
        800
    );

const renderer =
    new THREE.WebGLRenderer({
        antialias:false,
        powerPreference:
            "high-performance"
    });

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(1);

document.body.appendChild(
    renderer.domElement
);

/* =========================================================
   LIGHT
========================================================= */

const sun =
    new THREE.DirectionalLight(
        0xffd6a0,
        2
    );

sun.position.set(
    -180,
    260,
    100
);

scene.add(sun);

scene.add(
    new THREE.HemisphereLight(
        0xffd8a5,
        0x473a2e,
        1.2
    )
);

/* =========================================================
   MATERIALS
========================================================= */

const mat = {

    sand:
        new THREE.MeshLambertMaterial({
            color:0xc6965d
        }),

    road:
        new THREE.MeshLambertMaterial({
            color:0x8d633e
        }),

    wall:
        new THREE.MeshLambertMaterial({
            color:0xb77e4c
        }),

    wall2:
        new THREE.MeshLambertMaterial({
            color:0xd0a06b
        }),

    dark:
        new THREE.MeshLambertMaterial({
            color:0x42372f
        }),

    wood:
        new THREE.MeshLambertMaterial({
            color:0x704422
        }),

    metal:
        new THREE.MeshLambertMaterial({
            color:0x505050
        }),

    cloth:
        new THREE.MeshLambertMaterial({
            color:0x30322e
        }),

    glass:
        new THREE.MeshLambertMaterial({
            color:0x39464b
        }),

    plant:
        new THREE.MeshLambertMaterial({
            color:0x526044
        })
};

/* =========================================================
   OBJECT HELPERS
========================================================= */

const obstacles=[];

function cube(
    x,y,z,
    sx,sy,sz,
    material,
    obstacle=true,
    rotation=0
){

    const mesh =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                sx,sy,sz
            ),
            material
        );

    mesh.position.set(
        x,y,z
    );

    mesh.rotation.y=
        rotation;

    scene.add(mesh);

    if(obstacle){

        obstacles.push({
            x:x,
            z:z,
            w:sx,
            d:sz
        });
    }

    return mesh;
}

function cyl(
    x,y,z,
    radius,height,
    material
){

    const mesh =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                radius,
                radius,
                height,
                8
            ),
            material
        );

    mesh.position.set(
        x,y,z
    );

    scene.add(mesh);

    return mesh;
}

/* =========================================================
   GROUND
========================================================= */

cube(
    0,
    -2,
    0,
    620,
    4,
    620,
    mat.sand,
    false
);

/* =========================================================
   ROADS
========================================================= */

cube(
    0,
    .03,
    0,
    62,
    .1,
    560,
    mat.road,
    false
);

cube(
    0,
    .04,
    0,
    560,
    .1,
    62,
    mat.road,
    false
);

cube(
    0,
    .05,
    -175,
    300,
    .1,
    48,
    mat.road,
    false
);

cube(
    0,
    .05,
    175,
    300,
    .1,
    48,
    mat.road,
    false
);

/* =========================================================
   OUTER WALLS
========================================================= */

cube(
    0,18,-305,
    620,36,10,
    mat.wall
);

cube(
    0,18,305,
    620,36,10,
    mat.wall
);

cube(
    -305,18,0,
    10,36,620,
    mat.wall
);

cube(
    305,18,0,
    10,36,620,
    mat.wall
);

/* =========================================================
   BUILDING FUNCTION
========================================================= */

function building(
    x,z,
    w,d,
    h=22
){

    cube(
        x,
        h/2,
        z,
        w,
        h,
        d,
        mat.wall
    );

    cube(
        x,
        h+.4,
        z,
        w+2,
        .8,
        d+2,
        mat.wall2,
        false
    );

    /* door */

    cube(
        x-w*.2,
        5,
        z-d/2-.4,
        6,
        10,
        1,
        mat.dark,
        false
    );

    /* windows */

    for(
        let i=-1;
        i<=1;
        i++
    ){

        cube(
            x+i*w*.28,
            h*.62,
            z-d/2-.55,
            6,
            4,
            .4,
            mat.glass,
            false
        );
    }
}

/* =========================================================
   A AREA
========================================================= */

building(
    -225,-235,
    105,65,
    25
);

building(
    -145,-230,
    55,75,
    20
);

building(
    -245,-145,
    70,55,
    19
);

building(
    -145,-125,
    65,45,
    18
);

/* =========================================================
   B AREA
========================================================= */

building(
    225,235,
    105,65,
    25
);

building(
    145,230,
    55,75,
    20
);

building(
    245,145,
    70,55,
    19
);

building(
    145,125,
    65,45,
    18
);

/* =========================================================
   LONG WALLS
========================================================= */

cube(
    -55,
    9,
    -170,
    18,
    18,
    210,
    mat.wall
);

cube(
    55,
    9,
    -170,
    18,
    18,
    210,
    mat.wall
);

/* LONG SIDE BUILDINGS */

building(
    -125,-195,
    55,80,
    21
);

building(
    125,-195,
    55,80,
    21
);

/* =========================================================
   MID BUILDINGS
========================================================= */

building(
    -170,0,
    55,80,
    20
);

building(
    170,0,
    55,80,
    20
);

building(
    -120,75,
    45,55,
    18
);

building(
    120,75,
    45,55,
    18
);

/* =========================================================
   SHORT
========================================================= */

cube(
    -125,
    7,
    115,
    18,
    14,
    120,
    mat.wall
);

cube(
    125,
    7,
    115,
    18,
    14,
    120,
    mat.wall
);

/* =========================================================
   TUNNEL ENTRANCES
========================================================= */

function tunnel(
    x,z,
    length
){

    cube(
        x-14,
        9,
        z,
        12,
        18,
        length,
        mat.dark
    );

    cube(
        x+14,
        9,
        z,
        12,
        18,
        length,
        mat.dark
    );

    cube(
        x,
        19,
        z,
        40,
        3,
        length,
        mat.wall
    );
}

tunnel(
    -85,
    175,
    100
);

tunnel(
    85,
    -175,
    100
);

/* =========================================================
   MID COVER
========================================================= */

for(
    let x=-75;
    x<=75;
    x+=30
){

    cube(
        x,
        3,
        10,
        12,
        6,
        10,
        mat.wall2
    );
}

/* =========================================================
   BOXES
========================================================= */

for(
    let i=0;
    i<55;
    i++
){

    const x =
        Math.round(
            (Math.random()*500-250)/10
        )*10;

    const z =
        Math.round(
            (Math.random()*500-250)/10
        )*10;

    if(
        Math.abs(x)<40 &&
        Math.abs(z)<40
    )
        continue;

    cube(
        x,
        3,
        z,
        7,
        6,
        7,
        mat.wood,
        true,
        Math.random()*Math.PI
    );
}

/* =========================================================
   BARRELS
========================================================= */

for(
    let i=0;
    i<30;
    i++
){

    const x =
        Math.random()*500-250;

    const z =
        Math.random()*500-250;

    cyl(
        x,
        4,
        z,
        3,
        8,
        mat.metal
    );
}

/* =========================================================
   PALMS
========================================================= */

function palm(x,z){

    cyl(
        x,
        8,
        z,
        1.4,
        16,
        mat.wood
    );

    if(
        settings.graphics==="low"
    )
        return;

    for(
        let i=0;
        i<6;
        i++
    ){

        const leaf =
            cube(
                x,
                16,
                z,
                2,
                1,
                13,
                mat.plant,
                false,
                i*Math.PI/3
            );
    }
}

for(
    let i=0;
    i<22;
    i++
){

    palm(
        Math.random()*500-250,
        Math.random()*500-250
    );
}

/* =========================================================
   PLAYER
========================================================= */

const player =
    new THREE.Object3D();

scene.add(player);

player.position.set(
    -245,
    0,
    -255
);

player.add(camera);

camera.position.set(
    0,
    1.7,
    0
);

camera.rotation.order=
    "YXZ";

let yaw=0;
let pitch=0;

let keys={};

let gameRunning=false;

let walkSpeed=7;

/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    e=>{

        keys[e.code]=true;

        if(
            e.code==="KeyR"
        ){
            reload();
        }
    }
);

document.addEventListener(
    "keyup",
    e=>{
        keys[e.code]=false;
    }
);

/* =========================================================
   360 MOUSE
========================================================= */

document.addEventListener(
    "mousemove",
    e=>{

        if(
            document.pointerLockElement !==
            renderer.domElement
        )
            return;

        yaw -=
            e.movementX * .0022;

        pitch -=
            e.movementY * .0022;

        pitch =
            THREE.MathUtils.clamp(
                pitch,
                -1.48,
                1.48
            );

        player.rotation.y=
            yaw;

        camera.rotation.x=
            pitch;
    }
);

/* =========================================================
   COLLISION
========================================================= */

function blocked(
    x,z
){

    const radius=2.2;

    for(
        const o of obstacles
    ){

        if(
            x >
                o.x-o.w/2-radius &&
            x <
                o.x+o.w/2+radius &&
            z >
                o.z-o.d/2-radius &&
            z <
                o.z+o.d/2+radius
        ){
            return true;
        }
    }

    return false;
}

/* =========================================================
   MOVEMENT
========================================================= */

const clock =
    new THREE.Clock();

function movement(){

    const dt =
        Math.min(
            clock.getDelta(),
            .05
        );

    let speed=walkSpeed;

    if(
        keys.ShiftLeft ||
        keys.ShiftRight
    )
        speed=11;

    if(
        keys.ControlLeft ||
        keys.ControlRight
    )
        speed=4;

    const forward=
        new THREE.Vector3(
            0,0,-1
        );

    const right=
        new THREE.Vector3(
            1,0,0
        );

    forward.applyQuaternion(
        player.quaternion
    );

    right.applyQuaternion(
        player.quaternion
    );

    let move=
        new THREE.Vector3();

    if(keys.KeyW)
        move.add(forward);

    if(keys.KeyS)
        move.sub(forward);

    if(keys.KeyD)
        move.add(right);

    if(keys.KeyA)
        move.sub(right);

    if(
        move.lengthSq()>0
    ){

        move.normalize();

        const nx =
            player.position.x +
            move.x *
            speed *
            dt;

        const nz =
            player.position.z +
            move.z *
            speed *
            dt;

        if(
            !blocked(
                nx,
                player.position.z
            )
        ){
            player.position.x=nx;
        }

        if(
            !blocked(
                player.position.x,
                nz
            )
        ){
            player.position.z=nz;
        }
    }

    player.position.x=
        THREE.MathUtils.clamp(
            player.position.x,
            -290,
            290
        );

    player.position.z=
        THREE.MathUtils.clamp(
            player.position.z,
            -290,
            290
        );

    locationText();
}

/* =========================================================
   LOCATION
========================================================= */

function locationText(){

    const x=
        player.position.x;

    const z=
        player.position.z;

    let name="MID";

    if(
        x<-150 &&
        z<-140
    )
        name="A SITE";

    else if(
        x>150 &&
        z>140
    )
        name="B SITE";

    else if(
        Math.abs(x)<70 &&
        z<-120
    )
        name="LONG";

    else if(
        Math.abs(x)>120 &&
        Math.abs(z)<120
    )
        name="SHORT";

    else if(
        Math.abs(x)<100 &&
        Math.abs(z)<100
    )
        name="MID";

    else if(
        z>100
    )
        name="B SIDE";

    else
        name="A SIDE";

    document.getElementById(
        "location"
    ).textContent=name;
}

/* =========================================================
   SHOOTING
========================================================= */

let ammo=30;

let reloading=false;

let lastShot=0;

function shoot(){

    if(!gameRunning)
        return;

    if(reloading)
        return;

    if(ammo<=0){

        reload();

        return;
    }

    const now=
        performance.now();

    if(
        now-lastShot<110
    )
        return;

    lastShot=now;

    ammo--;

    document.getElementById(
        "ammoNumber"
    ).textContent=ammo;

    const flash=
        document.getElementById(
            "flash"
        );

    flash.style.display=
        "block";

    setTimeout(
        ()=>{
            flash.style.display=
                "none";
        },
        55
    );

    const weapon=
        document.getElementById(
            "weapon"
        );

    weapon.animate(
        [
            {
                transform:
                    "translate(0,0)"
            },
            {
                transform:
                    "translate(-12px,9px) rotate(-2deg)"
            },
            {
                transform:
                    "translate(0,0)"
            }
        ],
        {
            duration:100,
            easing:"ease-out"
        }
    );

    const ray=
        new THREE.Raycaster();

    ray.setFromCamera(
        new THREE.Vector2(0,0),
        camera
    );

    const hits=
        ray.intersectObjects(
            scene.children,
            true
        );

    if(
        hits.length>0
    ){

        const marker=
            document.getElementById(
                "hitmarker"
            );

        marker.style.display=
            "block";

        setTimeout(
            ()=>{
                marker.style.display=
                    "none";
            },
            80
        );
    }
}

document.addEventListener(
    "mousedown",
    e=>{

        if(
            e.button===0 &&
            gameRunning &&
            document.pointerLockElement===
            renderer.domElement
        ){
            shoot();
        }
    }
);

/* =========================================================
   RELOAD
========================================================= */

function reload(){

    if(reloading)
        return;

    if(ammo===30)
        return;

    reloading=true;

    document.getElementById(
        "reload"
    ).style.display=
        "block";

    const weapon=
        document.getElementById(
            "weapon"
        );

    weapon.animate(
        [
            {
                transform:
                    "rotate(0deg)"
            },
            {
                transform:
                    "rotate(12deg) translateY(35px)"
            },
            {
                transform:
                    "rotate(-8deg)"
            },
            {
                transform:
                    "rotate(0deg)"
            }
        ],
        {
            duration:1200
        }
    );

    setTimeout(
        ()=>{

            ammo=30;

            document.getElementById(
                "ammoNumber"
            ).textContent=ammo;

            document.getElementById(
                "reload"
            ).style.display=
                "none";

            reloading=false;

        },
        1200
    );
}

/* =========================================================
   SETTINGS
========================================================= */

function applySettings(){

    if(
        settings.graphics==="low"
    ){

        renderer.setPixelRatio(1);

        sun.intensity=1.7;

    }else if(
        settings.graphics==="medium"
    ){

        renderer.setPixelRatio(
            Math.min(
                devicePixelRatio,
                1.25
            )
        );

        sun.intensity=2;

    }else{

        renderer.setPixelRatio(
            Math.min(
                devicePixelRatio,
                1.6
            )
        );

        sun.intensity=2.2;
    }

    if(
        settings.distance==="low"
    ){

        scene.fog.near=60;
        scene.fog.far=250;

    }else if(
        settings.distance==="medium"
    ){

        scene.fog.near=120;
        scene.fog.far=450;

    }else{

        scene.fog.near=180;
        scene.fog.far=700;
    }

    saveSettings();

    updateSettingsButtons();
}

function updateSettingsButtons(){

    document
        .querySelectorAll(
            "[data-g]"
        )
        .forEach(
            b=>{
                b.classList.toggle(
                    "selected",
                    b.dataset.g===
                    settings.graphics
                );
            }
        );

    document
        .querySelectorAll(
            "[data-fps]"
        )
        .forEach(
            b=>{
                b.classList.toggle(
                    "selected",
                    Number(
                        b.dataset.fps
                    )===
                    settings.fps
                );
            }
        );

    document
        .querySelectorAll(
            "[data-shadow]"
        )
        .forEach(
            b=>{
                b.classList.toggle(
                    "selected",
                    Number(
                        b.dataset.shadow
                    )===
                    Number(
                        settings.shadows
                    )
                );
            }
        );

    document
        .querySelectorAll(
            "[data-distance]"
        )
        .forEach(
            b=>{
                b.classList.toggle(
                    "selected",
                    b.dataset.distance===
                    settings.distance
                );
            }
        );
}

/* graphics */

document
    .querySelectorAll(
        "[data-g]"
    )
    .forEach(
        b=>{

            b.onclick=()=>{

                settings.graphics=
                    b.dataset.g;

                applySettings();
            };
        }
    );

/* fps */

document
    .querySelectorAll(

        }

/* shadows */

document

        "[data-shadow]"
    )
    .forEach(
        b=>{

            b.onclick=()=>{

                settings.shadows=

                    );

                applySettings();
            };
        }
    );

/* distance */

document
    .querySelectorAll(
        "[data-distance]"
    )
    .forEach(

                applySettings();
            };
        }
    );

/* =========================================================
   MENU
========================================================= */

document.getElementById(
    "settingsButton"
).onclick=()=>{

    document.getElementById(
        "settings"
    ).style.display=
        "flex";

    updateSettingsButtons();
};

document.getElementById(
    "closeSettings"
).onclick=()=>{

    document.getElementById(
        "settings"
    ).style.display=
        "none";
};

/* =========================================================
   PLAY
========================================================= */

document.getElementById(
    "play"
).onclick=async()=>{

    gameRunning=true;

    document.getElementById(
        "menu"
    ).style.display=
        "none";

    document.getElementById(
        "hud"
    ).style.display=
        "block";

    player.position.set(
        -245,
        0,
        -255
    );

    yaw=0;
    pitch=0;

    player.rotation.y=0;
    camera.rotation.x=0;

    try{

        await renderer.domElement
            .requestPointerLock();

    }catch(e){
        console.log(
            "Pointer lock:",
            e
        );
    }
};

/* =========================================================
   ESC
========================================================= */

document.addEventListener(
    "pointerlockchange",
    ()=>{

        if(
            document.pointerLockElement !==
            renderer.domElement
        ){

            if(gameRunning){

                gameRunning=false;

                document.getElementById(
                    "menu"
                ).style.display=
                    "flex";

                document.getElementById(
                    "hud"
                ).style.display=
                    "none";
            }
        }
    }
);

/* =========================================================
   FPS
========================================================= */

let frames=0;

let fpsStart=
    performance.now();

let lastFrame=0;

function updateFPS(){

    frames++;

    const now=
        performance.now();

    if(
        now-fpsStart>=1000
    ){

        document.getElementById(
            "fps"
        ).textContent=
            "FPS: "+frames;

        frames=0;

        fpsStart=now;
    }
}

/* =========================================================
   LOOP
========================================================= */

function animate(time){

    requestAnimationFrame(
        animate
    );

    if(
        settings.fps>0
    ){

        const interval=
            1000/settings.fps;

        if(
            time-lastFrame<
            interval
        )
            return;

        lastFrame=time;
    }

    if(gameRunning)
        movement();

    updateFPS();

    renderer.render(
        scene,
        camera
    );
}

applySettings();

animate(0);

/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);
