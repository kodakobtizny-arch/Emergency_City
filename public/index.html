<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emergency City - Tactical Desert</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,Helvetica,sans-serif;
}

canvas{
    display:block;
}

#menu{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:white;
    background:
        linear-gradient(#0008,#000b),
        radial-gradient(circle at center,#b98752,#21160d);
}

#menu h1{
    margin:0;
    font-size:64px;
    letter-spacing:8px;
    text-shadow:0 5px 20px #000;
}

#menu p{
    margin:15px 0;
    color:#ddd;
    font-size:18px;
}

#play{
    margin-top:25px;
    padding:16px 70px;
    border:0;
    background:#b87939;
    color:white;
    font-size:21px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 5px 20px #0008;
}

#play:hover{
    background:#d18b43;
}

#hud{
    position:fixed;
    inset:0;
    z-index:10;
    pointer-events:none;
    color:white;
}

#crosshair{
    position:absolute;
    left:50%;
    top:50%;
    width:5px;
    height:5px;
    transform:translate(-50%,-50%);
    background:white;
    box-shadow:
        0 0 2px #000,
        0 0 5px #000;
}

.cross{
    position:absolute;
    background:white;
}

.cross.top{
    width:2px;
    height:9px;
    left:50%;
    top:calc(50% - 15px);
    transform:translateX(-50%);
}

.cross.bottom{
    width:2px;
    height:9px;
    left:50%;
    top:calc(50% + 7px);
    transform:translateX(-50%);
}

.cross.left{
    height:2px;
    width:9px;
    top:50%;
    left:calc(50% - 15px);
    transform:translateY(-50%);
}

.cross.right{
    height:2px;
    width:9px;
    top:50%;
    left:calc(50% + 7px);
    transform:translateY(-50%);
}

#score{
    position:absolute;
    top:18px;
    left:50%;
    transform:translateX(-50%);
    padding:10px 28px;
    background:#111c;
    border-bottom:2px solid #b87939;
    font-size:22px;
    font-weight:bold;
}

.blue{
    color:#4ca9ff;
}

.red{
    color:#ff5555;
}

#healthBox{
    position:absolute;
    left:25px;
    bottom:25px;
}

#healthText{
    font-size:20px;
    font-weight:bold;
    margin-bottom:7px;
    text-shadow:0 2px 4px #000;
}

#healthOuter{
    width:250px;
    height:24px;
    border:2px solid white;
    background:#111c;
}

#healthBar{
    width:100%;
    height:100%;
    background:#43c765;
}

#ammo{
    position:absolute;
    right:30px;
    bottom:25px;
    font-size:32px;
    font-weight:bold;
    text-shadow:0 3px 8px #000;
}

#ammo small{
    font-size:18px;
    color:#bbb;
}

#hitmarker{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    color:white;
    font-size:38px;
    opacity:0;
    text-shadow:0 2px 5px #000;
}

#status{
    position:absolute;
    left:50%;
    bottom:20px;
    transform:translateX(-50%);
    font-size:13px;
    color:#ddd;
    text-shadow:0 2px 5px #000;
}
</style>
</head>

/* =========================================================
   SHOOT
========================================================= */

function shoot(){

    if(reloading)
        return;

    if(ammo<=0){

        reload();

        return;
    }

    ammo--;

    updateAmmo();

    shootAnimation();

    const ray =
        new THREE.Raycaster();

    ray.setFromCamera(
        new THREE.Vector2(0,0),
        camera
    );

    const hits =
        ray.intersectObjects(
            scene.children,
            true
        );

    if(hits.length){

        showHitmarker();
    }

    if(socket &&
       socket.readyState===WebSocket.OPEN){

        let target=null;

        for(const hit of hits){

            let obj=hit.object;

            while(obj){

                if(
                    obj.userData &&
                    obj.userData.playerId
                ){

                    target =
                        obj.userData.playerId;

                    break;
                }

                obj=obj.parent;
            }

            if(target)
                break;
        }

        if(target){

            socket.send(
                JSON.stringify({
                    type:"hit",
                    target:target,
                    damage:25
                })
            );
        }
    }
}

   MOUSE
========================================================= */

    "mousedown",
    e=>{

        if(
            controls.isLocked &&
            e.button===0
        ){

            shoot();
        }
    }
);


/* =========================================================
   RELOAD
========================================================= */

function reload(){

    if(reloading)
        return;

    if(ammo===30)
        return;

    if(reserve<=0)
        return;

    reloading=true;

    const oldY =
        weapon.position.y;

    const oldX =
        weapon.rotation.x;

    weapon.position.y =
        oldY-.15;

    weapon.rotation.x =
        -.5;

    setTimeout(()=>{

        magazine.rotation.x =
            .8;

    },180);

    setTimeout(()=>{

        magazine.rotation.x =
            -.18;

    },550);

    setTimeout(()=>{

        const needed =
            30-ammo;

        const take =
            Math.min(
                needed,
                reserve
            );

        ammo += take;
        reserve -= take;

        updateAmmo();

        weapon.position.y =
            oldY;

        weapon.rotation.x =
            oldX;

        reloading=false;

    },850);
}


/* =========================================================
   HITMARKER
========================================================= */

function showHitmarker(){

    const h =
        document.getElementById(
            "hitmarker"
        );

    h.style.opacity=1;

    setTimeout(()=>{
        h.style.opacity=0;
    },100);
}


/* =========================================================
   WEAPON ANIMATION
========================================================= */

function updateWeapon(){

    recoil *= .78;
    recoilSide *= .78;

    weapon.position.z =
        -.85 + recoil;

    weapon.rotation.x =
        recoil*1.8;

    weapon.rotation.y =
        recoilSide;

    if(
        keys.KeyW ||
        keys.KeyA ||
        keys.KeyS ||
        keys.KeyD
    ){

        const t =
            performance.now()*.012;

        weapon.position.y +=
            Math.sin(t)*.004;

        weapon.position.x +=
            Math.cos(t*.7)*.003;
    }
}


/* =========================================================
   MULTIPLAYER
========================================================= */

let socket=null;
let myId=null;

const otherPlayers =
    new Map();


/* =========================================================
   CREATE OTHER PLAYER
========================================================= */

function createOtherPlayer(p){

    const group =
        new THREE.Group();

    group.userData.playerId =
        p.id;

    const teamMat =
        new THREE.MeshStandardMaterial({
            color:
                p.team==="a"
                    ? 0x287dff
                    : 0xff3434
        });

    const body =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .7,
                1.2,
                .45
            ),
            teamMat
        );

    body.position.y=.8;

    group.add(body);

    const head =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .27,
                12,
                12
            ),
            new THREE.MeshStandardMaterial({
                color:0xb98562
            })
        );

    head.position.y=1.65;

    group.add(head);

    group.position.set(
        p.x,
        0,
        p.z
    );

    scene.add(group);

    otherPlayers.set(
        p.id,
        group
    );
}


/* =========================================================
   UPDATE OTHER PLAYERS
========================================================= */

function updateOtherPlayers(list){

    const seen =
        new Set();

    for(const p of list){

        if(p.id===myId)
            continue;

        seen.add(p.id);

        if(!otherPlayers.has(p.id)){

            createOtherPlayer(p);

        }else{

            const obj =
                otherPlayers.get(p.id);

            obj.position.lerp(
                new THREE.Vector3(
                    p.x,
                    0,
                    p.z
                ),
                .35
            );

            obj.rotation.y =
                p.rot || 0;
        }
    }

    for(
        const [id,obj]
        of otherPlayers
    ){

        if(!seen.has(id)){

            scene.remove(obj);

            otherPlayers.delete(id);
        }
    }
}


/* =========================================================
   CONNECT SERVER
========================================================= */

function connect(){

    const protocol =
        location.protocol==="https:"
            ? "wss"
            : "ws";

    socket =
        new WebSocket(
            `${protocol}://${location.host}`
        );

    socket.onmessage =
        event=>{

            const data =
                JSON.parse(
                    event.data
                );

            if(data.type==="welcome"){

                myId =
                    data.id;
            }

            if(data.type==="state"){

                updateOtherPlayers(
                    data.players
                );

                const me =
                    data.players.find(
                        p=>p.id===myId
                    );

                if(me){

                    updateHealth(
                        me.hp
                    );
                }
            }

            if(data.type==="round"){

                document.getElementById(
                    "score"
                ).innerHTML =
                    `<span class="blue">BLUE ${data.you}</span>
                    &nbsp;:&nbsp;
                    <span class="red">${data.enemy} RED</span>`;
            }
        };

    socket.onclose =
        ()=>{

            setTimeout(
                connect,
                3000
            );
        };
}

connect();


/* =========================================================
   HEALTH
========================================================= */

function updateHealth(hp){

    hp =
        Math.max(
            0,
            Math.min(
                100,
                hp
            )
        );

    document.getElementById(
        "healthBar"
    ).style.width =
        hp+"%";

    document.getElementById(
        "healthText"
    ).textContent =
        Math.round(hp)+" HP";
}


/* =========================================================
   SEND POSITION
========================================================= */

setInterval(()=>{

    if(
        socket &&
        socket.readyState===WebSocket.OPEN &&
        controls.isLocked
    ){

        socket.send(
            JSON.stringify({
                type:"update",
                x:camera.position.x,
                z:camera.position.z,
                rot:camera.rotation.y
            })
        );
    }

},50);


/* =========================================================
   MOVEMENT
========================================================= */

const clock =
    new THREE.Clock();

function movement(){

    const dt =
        Math.min(
            clock.getDelta(),
            .05
        );

    let speed =
        keys.ShiftLeft ||
        keys.ShiftRight
            ? 10
            : 6;

    if(keys.ControlLeft)
        speed=3;

    if(keys.KeyW)
        controls.moveForward(
            speed*dt
        );

    if(keys.KeyS)
        controls.moveForward(
            -speed*dt
        );

    if(keys.KeyA)
        controls.moveRight(
            -speed*dt
        );

    if(keys.KeyD)
        controls.moveRight(
            speed*dt
        );

    camera.position.y=1.7;

    camera.position.x =
        THREE.MathUtils.clamp(
            camera.position.x,
            -90,
            90
        );

    camera.position.z =
        THREE.MathUtils.clamp(
            camera.position.z,
            -90,
            90
        );
}


/* =========================================================
   GAME LOOP
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );

    if(controls.isLocked){

        movement();

        updateWeapon();
    }

    renderer.render(
        scene,
        camera
    );
}

animate();


/* =========================================================
   PLAY
========================================================= */

document.getElementById(
    "play"
).onclick=()=>{

    document.getElementById(
        "menu"
    ).style.display="none";

    controls.lock();
};


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect =
            innerWidth/
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);

</script>
