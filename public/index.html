<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tactical City FPS</title>

<style>
*{
    box-sizing:border-box;
    user-select:none;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    font-family:Arial,Helvetica,sans-serif;
}

canvas{
    display:block;
}

#hud{
    position:fixed;
    inset:0;
    pointer-events:none;
    color:white;
}

#top{
    position:absolute;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:25px;
    padding:10px 22px;
    border-radius:10px;
    background:rgba(10,12,15,.82);
    border:1px solid rgba(255,255,255,.12);
    font-weight:bold;
}

#healthBox{
    position:absolute;
    left:25px;
    bottom:25px;
    width:230px;
}

#healthText{
    font-size:25px;
    font-weight:bold;
    margin-bottom:6px;
}

#healthBar{
    width:100%;
    height:18px;
    background:#292929;
    border:1px solid #555;
    border-radius:5px;
    overflow:hidden;
}

#healthFill{
    width:100%;
    height:100%;
    background:#28b957;
}

#ammo{
    position:absolute;
    right:30px;
    bottom:25px;
    font-size:34px;
    font-weight:bold;
    text-shadow:0 3px 8px black;
}

#weaponName{
    position:absolute;
    right:32px;
    bottom:70px;
    font-size:16px;
    color:#bbb;
}

#crosshair{
    position:absolute;
    left:50%;
    top:50%;
    width:20px;
    height:20px;
    transform:translate(-50%,-50%);
}

#crosshair:before,
#crosshair:after{
    content:"";
    position:absolute;
    background:white;
    box-shadow:0 0 3px black;
}

#crosshair:before{
    width:2px;
    height:20px;
    left:9px;
    top:0;
}

#crosshair:after{
    width:20px;
    height:2px;
    left:0;
    top:9px;
}

#hitmarker{
    display:none;
    position:absolute;
    left:50%;
    top:50%;
    width:22px;
    height:22px;
    transform:translate(-50%,-50%);
}

#hitmarker:before,
#hitmarker:after{
    content:"";
    position:absolute;
    width:3px;
    height:25px;
    background:white;
    left:9px;
    top:-2px;
}

#hitmarker:before{
    transform:rotate(45deg);
}

#hitmarker:after{
    transform:rotate(-45deg);
}

#message{
    position:absolute;
    left:50%;
    top:75%;
    transform:translateX(-50%);
    padding:12px 22px;
    background:rgba(0,0,0,.75);
    border-radius:8px;
    display:none;
}

#instructions{
    position:absolute;
    left:25px;
    top:25px;
    padding:12px 15px;
    background:rgba(0,0,0,.65);
    border-radius:8px;
    color:#ddd;
    font-size:13px;
    line-height:1.6;
}

#score{
    font-size:18px;
}

#round{
    font-size:14px;
    color:#bbb;
}

#damageFlash{
    position:fixed;
    inset:0;
    background:rgba(255,0,0,.22);
    display:none;
}

#menu{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,.72);
    z-index:20;
}

#menuBox{
    width:430px;
    max-width:90%;
    padding:30px;
    background:#17191d;
    border:1px solid #45484e;
    border-radius:14px;
    color:white;
    text-align:center;
    box-shadow:0 20px 80px #000;
}

#menuBox h1{
    margin:0 0 8px;
    font-size:32px;
}

#menuBox p{
    color:#aaa;
}

#playButton{
    margin-top:15px;
    width:100%;
    padding:14px;
    border:0;
    border-radius:8px;
    background:#2869d8;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

#playButton:hover{
    background:#3679ed;
}

#connection{
    margin-top:12px;
    color:#888;
    font-size:13px;
}

#reload{
    position:absolute;
    right:32px;
    bottom:115px;
    color:#aaa;
    font-size:13px;
}
</style>
</head>

<body>

<div id="menu">
    <div id="menuBox">
        <h1>TACTICAL CITY</h1>
        <p>Multiplayer Tactical FPS</p>
        <p>WASD · Mouse · LMB · RMB · SHIFT · CTRL · R</p>
        <button id="playButton">PLAY</button>
        <div id="connection">Connecting...</div>
    </div>
</div>

<div id="hud">

    <div id="instructions">
        <b>WASD</b> — pohyb<br>
        <b>SHIFT</b> — sprint<br>
        <b>CTRL</b> — crouch<br>
        <b>LMB</b> — střelba<br>
        <b>RMB</b> — aim<br>
        <b>R</b> — reload
    </div>

    <div id="top">
        <span id="score">BLUE 0 : 0 RED</span>
        <span id="round">ROUND 1</span>
    </div>

    <div id="healthBox">
        <div id="healthText">100 HP</div>
        <div id="healthBar">
            <div id="healthFill"></div>
        </div>
    </div>

    <div id="weaponName">
        CARBINE
    </div>

    <div id="ammo">
        <span id="mag">30</span> / 120
    </div>

    <div id="reload">
        R — RELOAD
    </div>

    <div id="crosshair"></div>
    <div id="hitmarker"></div>

    <div id="message"></div>

</div>

<div id="damageFlash"></div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

/* =========================================================
   SCÉNA
========================================================= */

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x899ba6);

scene.fog =
    new THREE.Fog(
        0x899ba6,
        80,
        500
    );

/* =========================================================
   KAMERA
========================================================= */

const camera =
    new THREE.PerspectiveCamera(
        75,
        innerWidth / innerHeight,
        0.05,
        700
    );

camera.position.set(
    0,
    2,
    8
);

/* =========================================================
   RENDERER
========================================================= */

const renderer =
    new THREE.WebGLRenderer({
        antialias:true
    });

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(
        devicePixelRatio,
        1.5
    )
);

renderer.shadowMap.enabled=true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

document.body.appendChild(
    renderer.domElement
);

/* =========================================================
   SVĚTLO
========================================================= */

const sun =
    new THREE.DirectionalLight(
        0xffffff,
        2.2
    );

sun.position.set(
    100,
    180,
    80
);

sun.castShadow=true;

sun.shadow.mapSize.width=1024;
sun.shadow.mapSize.height=1024;

sun.shadow.camera.left=-250;
sun.shadow.camera.right=250;
sun.shadow.camera.top=250;
sun.shadow.camera.bottom=-250;

scene.add(sun);

scene.add(
    new THREE.HemisphereLight(
        0xd8edff,
        0x465044,
        1.4
    )
);

/* =========================================================
   MATERIÁLY
========================================================= */

function mat(
    color,
    roughness=.8,
    metalness=0
){

    return new THREE.MeshStandardMaterial({
        color,
        roughness,
        metalness
    });
}

/* =========================================================
   KOSTKA
========================================================= */

function box(
    x,y,z,
    sx,sy,sz,
    color,
    options={}
){

    const mesh =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                sx,
                sy,
                sz
            ),
            mat(
                color,
                options.roughness ??
                .8,
                options.metalness ??
                0
            )
        );

    mesh.position.set(
        x,y,z
    );

    mesh.castShadow =
        options.cast ??
        true;

    mesh.receiveShadow =
        options.receive ??
        true;

    scene.add(mesh);

    return mesh;
}

/* =========================================================
   ZEM
========================================================= */

box(
    0,
    -0.15,
    0,
    600,
    .3,
    600,
    0x4c624d,
    {
        cast:false
    }
);

/* =========================================================
   SILNICE
========================================================= */

const roadColor =
    0x292b2e;

const sidewalkColor =
    0x777b7d;

/* hlavní silnice */

box(
    0,
    .02,
    0,
    600,
    .08,
    28,
    roadColor,
    {
        cast:false
    }
);

box(
    0,
    .025,
    0,
    28,
    .08,
    600,
    roadColor,
    {
        cast:false
    }
);

/* vedlejší ulice */

for(
    let i=-240;
    i<=240;
    i+=80
){

    if(
        Math.abs(i)<35
    ) continue;

    box(
        i,
        .025,
        0,
        12,
        .07,
        600,
        roadColor,
        {
            cast:false
        }
    );

    box(
        0,
        .025,
        i,
        600,
        .07,
        12,
        roadColor,
        {
            cast:false
        }
    );
}

/* =========================================================
   CHODNÍKY
========================================================= */

function sidewalkH(z){

    box(
        0,
        .10,
        z,
        600,
        .15,
        4,
        sidewalkColor,
        {
            cast:false
        }
    );
}

function sidewalkV(x){

    box(
        x,
        .10,
        0,
        4,
        .15,
        600,
        sidewalkColor,
        {
            cast:false
        }
    );
}

sidewalkH(16);
sidewalkH(-16);

sidewalkV(16);
sidewalkV(-16);

for(
    let i=-240;
    i<=240;
    i+=80
){

    if(
        Math.abs(i)<35
    ) continue;

    sidewalkV(i-8);
    sidewalkV(i+8);

    sidewalkH(i-8);
    sidewalkH(i+8);
}

/* =========================================================
   ČÁRY NA SILNICI
========================================================= */

for(
    let i=-290;
    i<290;
    i+=12
){

    box(
        i,
        .075,
        0,
        6,
        .025,
        .18,
        0xded9bd,
        {
            cast:false
        }
    );

    box(
        0,
        .08,
        i,
        .18,
        .025,
        6,
        0xded9bd,
        {
            cast:false
        }
    );
}

/* =========================================================
   BUDOVY
========================================================= */

const buildingColors=[
    0x8f9290,
    0xa9a198,
    0x737b80,
    0xb2b0a6,
    0x858989,
    0xc0b6a4,
    0x777578
];

function windowFront(
    x,
    y,
    z,
    width=1.6,
    height=1.3
){

    const glass =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width,
                height,
                .06
            ),
            mat(
                0x263d49,
                .22,
                .15
            )
        );

    glass.position.set(
        x,y,z
    );

    scene.add(glass);

    /* rámy */

    box(
        x-width/2-.035,
        y,
        z-.04,
        .06,
        height+.08,
        .08,
        0x45484a
    );

    box(
        x+width/2+.035,
        y,
        z-.04,
        .06,
        height+.08,
        .08,
        0x45484a
    );

    box(
        x,
        y-height/2-.035,
        z-.04,
        width+.08,
        .06,
        .08,
        0x45484a
    );

    box(
        x,
        y+height/2+.035,
        z-.04,
        width+.08,
        .06,
        .08,
        0x45484a
    );
}

function building(
    x,
    z,
    width,
    depth,
    height
){

    const color =
        buildingColors[
            Math.floor(
                Math.random() *
                buildingColors.length
            )
        ];

    box(
        x,
        height/2,
        z,
        width,
        height,
        depth,
        color
    );

    /* střecha */

    box(
        x,
        height+.18,
        z,
        width+.4,
        .35,
        depth+.4,
        0x404143
    );

    const floors =
        Math.max(
            2,
            Math.floor(
                height/4
            )
        );

    const floorHeight =
        height/floors;

    /* okna */

    for(
        let floor=0;
        floor<floors;
        floor++
    ){

        const y =
            floor *
            floorHeight +
            floorHeight*.55;

        const columns =
            Math.max(
                2,
                Math.floor(
                    width/5
                )
            );

        for(
            let col=0;
            col<columns;
            col++
        ){

            const gap =
                width/
                (columns+1);

            const wx =
                x-width/2+
                gap*(col+1);

            windowFront(
                wx,
                y,
                z-depth/2-.07
            );
        }
    }

    /* dveře */

    box(
        x,
        1.3,
        z-depth/2-.12,
        2.1,
        2.6,
        .12,
        0x25282b
    );

    /* schody */

    box(
        x,
        .17,
        z-depth/2-.8,
        3,
        .25,
        1.2,
        0x66696a
    );
}

/* městská mřížka */

for(
    let x=-280;
    x<=280;
    x+=80
){

    for(
        let z=-280;
        z<=280;
        z+=80
    ){

        if(
            Math.abs(x)<42 ||
            Math.abs(z)<42
        ) continue;

        const width =
            32+
            Math.random()*12;

        const depth =
            32+
            Math.random()*12;

        const height =
            12+
            Math.random()*40;

        building(
            x,
            z,
            width,
            depth,
            height
        );
    }
}

/* =========================================================
   STROMY
========================================================= */

function tree(x,z){

    const trunk =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .25,
                .4,
                3,
                8
            ),
            mat(0x634021)
        );

    trunk.position.set(
        x,
        1.5,
        z
    );

    trunk.castShadow=true;

    scene.add(trunk);

    const crown =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                2.7,
                12,
                10
            ),
            mat(0x2e6835)
        );

    crown.position.set(
        x,
        4.4,
        z
    );

    crown.castShadow=true;

    scene.add(crown);
}

for(
    let i=0;
    i<90;
    i++
){

    const x =
        Math.random()*560-280;

    const z =
        Math.random()*560-280;

    if(
        Math.abs(x)<25 ||
        Math.abs(z)<25
    ) continue;

    tree(x,z);
}

/* =========================================================
   LAMPY
========================================================= */

function lamp(x,z){

    const pole =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .07,
                .12,
                6,
                8
            ),
            mat(
                0x252525,
                .5,
                .4
            )
        );

    pole.position.set(
        x,
        3,
        z
    );

    pole.castShadow=true;

    scene.add(pole);

    box(
        x+.45,
        5.7,
        z,
        1,
        .12,
        .12,
        0x292929
    );

    box(
        x+.9,
        5.55,
        z,
        .65,
        .15,
        .3,
        0xf0d995,
        {
            roughness:.3
        }
    );
}

for(
    let i=-260;
    i<=260;
    i+=50
){

    lamp(i,13);
    lamp(i,-13);
    lamp(13,i);
    lamp(-13,i);
}

/* =========================================================
   AUTA
========================================================= */

function car(
    x,
    z,
    rotation,
    color
){

    const group =
        new THREE.Group();

    const body =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                2.1,
                .65,
                4.2
            ),
            mat(
                color,
                .35,
                .05
            )
        );

    body.position.y=.65;

    group.add(body);

    const cabin =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1.65,
                .65,
                2
            ),
            mat(
                0x27343c,
                .2
            )
        );

    cabin.position.y=1.1;

    group.add(cabin);

    for(
        const side of [-1,1]
    ){

        for(
            const front of [-1,1]
        ){

            const wheel =
                new THREE.Mesh(
                    new THREE.CylinderGeometry(
                        .36,
                        .36,
                        .22,
                        12
                    ),
                    mat(0x121212)
                );

            wheel.rotation.z=
                Math.PI/2;

            wheel.position.set(
                side*1.08,
                .4,
                front*1.35
            );

            group.add(wheel);
        }
    }

    group.position.set(
        x,
        0,
        z
    );

    group.rotation.y=
        rotation;

    scene.add(group);
}

const carColors=[
    0x222222,
    0xb82d32,
    0x1e4e91,
    0xe4e4e4,
    0xd3aa28,
    0x737373
];

for(
    let i=0;
    i<35;
    i++
){

    let x,z;

    if(
        Math.random()>.5
    ){

        x=
            Math.random()*500-250;

        z=
            Math.random()>.5
            ? 9
            : -9;

    }else{

        x=
            Math.random()>.5
            ? 9
            : -9;

        z=
            Math.random()*500-250;
    }

    car(
        x,
        z,
        Math.random() >
        .5
        ? 0
        : Math.PI/2,
        carColors[
            Math.floor(
                Math.random()*
                carColors.length
            )
        ]
    );
}

/* =========================================================
   HRÁČ
========================================================= */

const player =
    new THREE.Group();

scene.add(player);

player.position.set(
    0,
    0,
    8
);

/* =========================================================
   ZBRAŇ
========================================================= */

const weapon =
    new THREE.Group();

camera.add(weapon);
scene.add(camera);

weapon.position.set(
    .38,
    -.35,
    -.75
);

weapon.rotation.set(
    -.03,
    -.12,
    -.02
);

/* pažba */

const gunBody =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            .22,
            .20,
            .9
        ),
        mat(
            0x202225,
            .45,
            .25
        )
    );

gunBody.position.z=-.25;

weapon.add(gunBody);

/* hlaveň */

const barrel =
    new THREE.Mesh(
        new THREE.CylinderGeometry(
            .055,
            .055,
            .85,
            12
        ),
        mat(
            0x151618,
            .3,
            .5
        )
    );

barrel.rotation.x=
    Math.PI/2;

barrel.position.z=
    -.82;

weapon.add(barrel);

/* zásobník */

const magazine =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            .15,
            .5,
            .2
        ),
        mat(
            0x17181a
        )
    );

magazine.position.set(
    0,
    -.27,
    -.05
);

magazine.rotation.x=
    -.2;

weapon.add(magazine);

/* rukojeť */

const grip =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            .17,
            .4,
            .17
        ),
        mat(
            0x18191b
        )
    );

grip.position.set(
    0,
    -.24,
    .28
);

grip.rotation.x=
    -.15;

weapon.add(grip);

/* muška */

box(
    0,
    0,
    0,
    .01,
    .01,
    .01,
    0xffffff
);

/* =========================================================
   RUCE
========================================================= */

const handMaterial =
    mat(
        0xd39b76,
        .8
    );

const leftHand =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            .17,
            .17,
            .45
        ),
        handMaterial
    );

leftHand.position.set(
    -.18,
    -.2,
    -.62
);

leftHand.rotation.x=
    -.3;

weapon.add(leftHand);

const rightHand =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            .17,
            .17,
            .45
        ),
        handMaterial
    );

rightHand.position.set(
    .15,
    -.23,
    -.05
);

rightHand.rotation.x=
    -.3;

weapon.add(rightHand);

/* =========================================================
   FLASH
========================================================= */

const flash =
    new THREE.PointLight(
        0xffb52d,
        0,
        8
    );

flash.position.set(
    0,
    0,
    -1.25
);

weapon.add(flash);

/* =========================================================
   OVLÁDÁNÍ
========================================================= */

const keys={};

let mouseX=0;
let mouseY=0;

let yaw=0;
let pitch=0;

let locked=false;
let aiming=false;
let crouching=false;

window.addEventListener(
    "keydown",
    e=>{

        keys[
            e.key.toLowerCase()
        ]=true;

        if(
            e.key.toLowerCase()==="r"
        ){

            reload();
        }

        if(
            e.key.toLowerCase()==="control"
        ){

            crouching=true;
        }
    }
);

window.addEventListener(
    "keyup",
    e=>{

        keys[
            e.key.toLowerCase()
        ]=false;

        if(
            e.key.toLowerCase()==="control"
        ){

            crouching=false;
        }
    }
);

renderer.domElement.addEventListener(
    "click",
    ()=>{

        if(!locked){

            renderer.domElement.requestPointerLock();

        }else{

            shoot();
        }
    }
);

document.addEventListener(
    "pointerlockchange",
    ()=>{

        locked =
            document.pointerLockElement ===
            renderer.domElement;
    }
);

document.addEventListener(
    "mousemove",
    e=>{

        if(!locked) return;

        yaw -=
            e.movementX*.002;

        pitch -=
            e.movementY*.002;

        pitch =
            THREE.MathUtils.clamp(
                pitch,
                -1.45,
                1.45
            );
    }
);

window.addEventListener(
    "mousedown",
    e=>{

        if(
            e.button===2
        ){

            aiming=true;
        }

        if(
            e.button===0 &&
            locked
        ){

            shooting=true;
        }
    }
);

window.addEventListener(
    "mouseup",
    e=>{

        if(
            e.button===2
        ){

            aiming=false;
        }

        if(
            e.button===0
        ){

            shooting=false;
        }
    }
);

window.addEventListener(
    "contextmenu",
    e=>{
        e.preventDefault();
    }
);

/* =========================================================
   STŘELBA
========================================================= */

let shooting=false;

let ammo=30;

let reserve=120;

let reloading=false;

let lastShot=0;

const FIRE_RATE=105;

function shoot(){

    if(
        reloading ||
        ammo<=0
    ) return;

    const now=
        performance.now();

    if(
        now-lastShot<
        FIRE_RATE
    ) return;

    lastShot=now;

    ammo--;

    document.getElementById(
        "mag"
    ).textContent=ammo;

    /* recoil */

    weapon.position.z=
        -.82;

    weapon.rotation.x=
        -.12;

    setTimeout(
        ()=>{
            weapon.position.z=
                -.75;
        },
        50
    );

    /* flash */

    flash.intensity=7;

    setTimeout(
        ()=>{
            flash.intensity=0;
        },
        45
    );

    /* raycast */

    raycaster.setFromCamera(
        new THREE.Vector2(0,0),
        camera
    );

    const objects=[];

    for(
        const p of otherPlayers.values()
    ){

        objects.push(
            ...p.children
        );
    }

    const hits =
        raycaster.intersectObjects(
            objects,
            true
        );

    if(hits.length){

        const hit=
            hits[0];

        let obj=
            hit.object;

        while(
            obj.parent &&
            !obj.userData.playerId
        ){

            obj=
                obj.parent;
        }

        const targetId=
            obj.userData.playerId;

        if(targetId){

            sendHit(
                targetId,
                34
            );

            showHitmarker();
        }
    }
}

/* automatická střelba */

setInterval(
    ()=>{
        if(shooting)
            shoot();
    },
    20
);

/* =========================================================
   RAYCASTER
========================================================= */

const raycaster =
    new THREE.Raycaster();

/* =========================================================
   RELOAD
========================================================= */

function reload(){

    if(
        reloading ||
        ammo>=30 ||
        reserve<=0
    ) return;

    reloading=true;

    showMessage(
        "RELOADING..."
    );

    setTimeout(
        ()=>{

            const needed=
                30-ammo;

            const amount=
                Math.min(
                    needed,
                    reserve
                );

            ammo+=amount;

            reserve-=amount;

            document.getElementById(
                "mag"
            ).textContent=
                ammo;

            reloading=false;

        },
        1400
    );
}

/* =========================================================
   AIM
========================================================= */

function updateAim(){

    const targetFov=
        aiming
        ? 52
        : 75;

    camera.fov +=
        (
            targetFov -
            camera.fov
        )*.12;

    camera.updateProjectionMatrix();

    const targetX=
        aiming
        ? .18
        : .38;

    const targetY=
        aiming
        ? -.30
        : -.35;

    weapon.position.x +=
        (
            targetX -
            weapon.position.x
        )*.15;

    weapon.position.y +=
        (
            targetY -
            weapon.position.y
        )*.15;
}

/* =========================================================
   HITMARKER
========================================================= */

function showHitmarker(){

    const h=
        document.getElementById(
            "hitmarker"
        );

    h.style.display="block";

    setTimeout(
        ()=>{
            h.style.display=
                "none";
        },
        100
    );
}

/* =========================================================
   MESSAGE
========================================================= */

let messageTimer;

function showMessage(text){

    const el=
        document.getElementById(
            "message"
        );

    el.textContent=text;

    el.style.display="block";

    clearTimeout(
        messageTimer
    );

    messageTimer=
        setTimeout(
            ()=>{
                el.style.display=
                    "none";
            },
            1500
        );
}

/* =========================================================
   WEBSOCKET
========================================================= */

let socket=null;
let myId=null;

let myHP=100;

const otherPlayers=
    new Map();

function connect(){

    const protocol=
        location.protocol==="https:"
        ? "wss:"
        : "ws:";

    socket=
        new WebSocket(
            protocol+
            "//"+
            location.host
        );

    socket.onopen=()=>{

        document.getElementById(
            "connection"
        ).textContent=
            "Connected";

        showMessage(
            "CONNECTED"
        );
    };

    socket.onerror=()=>{

        document.getElementById(
            "connection"
        ).textContent=
            "Connection error";
    };

    socket.onclose=()=>{

        document.getElementById(
            "connection"
        ).textContent=
            "Disconnected";

        setTimeout(
            connect,
            2000
        );
    };

    socket.onmessage=e=>{

        try{

            const data=
                JSON.parse(e.data);

            if(
                data.type===
                "welcome"
            ){

                myId=
                    data.id;

                myHP=
                    data.self.hp ??
                    100;
            }

            if(
                data.type===
                "state"
            ){

                updatePlayers(
                    data.players
                );
            }

            if(
                data.type===
                "round"
            ){

                document.getElementById(
                    "score"
                ).textContent=
                    "BLUE "+
                    data.you+
                    " : "+
                    data.enemy+
                    " RED";

                document.getElementById(
                    "round"
                ).textContent=
                    "ROUND "+
                    data.round;
            }

        }catch(err){

            console.log(err);
        }
    };
}

connect();

/* =========================================================
   OSTATNÍ HRÁČI
========================================================= */

function createOtherPlayer(p){

    if(
        otherPlayers.has(p.id)
    ) return;

    const group =
        new THREE.Group();

    group.userData.playerId=
        p.id;

    const color=
        p.team==="a"
        ? 0x286de0
        : 0xc82f36;

    /* tělo */

    const body =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .75,
                1.6,
                .45
            ),
            mat(color)
        );

    body.position.y=.95;

    body.userData.playerId=
        p.id;

    group.add(body);

    /* hlava */

    const head =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .36,
                16,
                12
            ),
            mat(
                0xc99672
            )
        );

    head.position.y=2.05;

    head.userData.playerId=
        p.id;

    group.add(head);

    /* zbraň */

    const gun =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .15,
                .15,
                .8
            ),
            mat(
                0x18191b,
                .3,
                .3
            )
        );

    gun.position.set(
        .35,
        1.25,
        -.35
    );

    gun.rotation.y=
        -.3;

    gun.userData.playerId=
        p.id;

    group.add(gun);

    scene.add(group);

    otherPlayers.set(
        p.id,
        group
    );
}

function updatePlayers(list){

    const active=
        new Set(
            list.map(
                p=>p.id
            )
        );

    for(
        const [id,obj]
        of otherPlayers
    ){

        if(
            !active.has(id)
        ){

            scene.remove(obj);

            otherPlayers.delete(id);
        }
    }

    for(
        const p of list
    ){

        if(
            p.id===myId
        ) continue;

        createOtherPlayer(p);

        const obj=
            otherPlayers.get(
                p.id
            );

        if(!obj) continue;

        obj.position.set(
            p.x,
            0,
            p.z
        );

        obj.rotation.y=
            p.rot || 0;
    }

    /* vlastní HP */

    const me=
        list.find(
            p=>p.id===myId
        );

    if(me){

        myHP=
            me.hp;

        updateHealth();
    }
}

/* =========================================================
   HEALTH
========================================================= */

function updateHealth(){

    document.getElementById(
        "healthText"
    ).textContent=
        Math.max(
            0,
            Math.floor(myHP)
        )+
        " HP";

    document.getElementById(
        "healthFill"
    ).style.width=
        Math.max(
            0,
            myHP
        )+
        "%";

    if(
        myHP<35
    ){

        document.getElementById(
            "healthFill"
        ).style.background=
            "#d52d2d";

    }else{

        document.getElementById(
            "healthFill"
        ).style.background=
            "#28b957";
    }
}

/* =========================================================
   HIT SERVER
========================================================= */

function sendHit(
    target,
    damage
){

    if(
        !socket ||
        socket.readyState !==
        WebSocket.OPEN
    ) return;

    socket.send(
        JSON.stringify({
            type:"hit",
            target,
            damage
        })
    );
}

/* =========================================================
   ODESÍLÁNÍ POZICE
========================================================= */

let lastNetwork=0;

function networkUpdate(){

    if(
        !socket ||
        socket.readyState !==
        WebSocket.OPEN
    ) return;

    const now=
        performance.now();

    if(
        now-lastNetwork<50
    ) return;

    socket.send(
        JSON.stringify({
            type:"update",
            x:camera.position.x,
            z:camera.position.z,
            rot:yaw,
            hp:myHP
        })
    );

    lastNetwork=now;
}

/* =========================================================
   START
========================================================= */

const menu=
    document.getElementById(
        "menu"
    );

document.getElementById(
    "playButton"
).addEventListener(
    "click",
    ()=>{
        menu.style.display="none";

        renderer.domElement.requestPointerLock();
    }
);

/* =========================================================
   POHYB
========================================================= */

const clock=
    new THREE.Clock();

function movement(dt){

    if(!locked) return;

    let forward=0;
    let strafe=0;

    if(keys["w"])
        forward+=1;

    if(keys["s"])
        forward-=1;

    if(keys["d"])
        strafe+=1;

    if(keys["a"])
        strafe-=1;

    if(
        forward===0 &&
        strafe===0
    ) return;

    const length=
        Math.hypot(
            forward,
            strafe
        );

    forward/=length;
    strafe/=length;

    let speed=
        6;

    if(
        keys["shift"] &&
        !crouching
    ){

        speed=10;
    }

    if(crouching){

        speed=3.5;
    }

    const direction=
        new THREE.Vector3(
            strafe,
            0,
            -forward
        );

    direction.applyAxisAngle(
        new THREE.Vector3(
            0,1,0
        ),
        yaw
    );

    camera.position.x +=
        direction.x *
        speed *
        dt;

    camera.position.z +=
        direction.z *
        speed *
        dt;

    camera.position.x=
        THREE.MathUtils.clamp(
            camera.position.x,
            -285,
            285
        );

    camera.position.z=
        THREE.MathUtils.clamp(
            camera.position.z,
            -285,
            285
        );
}

/* =========================================================
   KAMERA
========================================================= */

function updateCamera(){

    const targetHeight=
        crouching
        ? 1.2
        : 1.75;

    camera.position.y +=
        (
            targetHeight -
            camera.position.y
        )*.18;

    camera.rotation.order=
        "YXZ";

    camera.rotation.y=
        yaw;

    camera.rotation.x=
        pitch;
}

/* =========================================================
   ANIMACE ZBRANĚ
========================================================= */

let bobTime=0;

function weaponAnimation(dt){

    let moving=
        keys["w"] ||
        keys["a"] ||
        keys["s"] ||
        keys["d"];

    if(moving){

        bobTime+=
            dt*
            (
                keys["shift"]
                ? 13
                : 8
            );

        weapon.position.y +=
            (
                -.35+
                Math.sin(
                    bobTime
                )*.018-
                weapon.position.y
            )*.15;

    }else{

        weapon.position.y +=
            (
                -.35-
                weapon.position.y
            )*.1;
    }

    updateAim();
}

/* =========================================================
   GAME LOOP
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );

    const dt=
        Math.min(
            clock.getDelta(),
            .05
        );

    movement(dt);

    updateCamera();

    weaponAnimation(dt);

    networkUpdate();

    renderer.render(
        scene,
        camera
    );
}

animate();

/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);

</script>
