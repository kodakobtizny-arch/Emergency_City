<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Tactical Desert FPS</title>

<style>
*{
    box-sizing:border-box;
    user-select:none;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
}

/* ================= MENU ================= */

#menu{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:
        linear-gradient(
            rgba(0,0,0,.35),
            rgba(0,0,0,.8)
        ),
        linear-gradient(
            135deg,
            #a87842,
            #211914
        );
    color:white;
}

#menu h1{
    margin:0;
    font-size:58px;
    letter-spacing:7px;
    text-shadow:0 5px 20px #000;
}

#menu p{
    color:#ccc;
    margin:8px 0 35px;
}

.menuBtn{
    width:280px;
    padding:16px;
    margin:6px;
    border:1px solid #777;
    background:#191919;
    color:white;
    font-size:18px;
    cursor:pointer;
}

.menuBtn:hover{
    background:#8a5d32;
}

/* ================= SETTINGS ================= */

#settings{
    position:fixed;
    inset:0;
    z-index:200;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.86);
}

.panel{
    width:430px;
    max-width:92%;
    padding:28px;
    background:#181818;
    color:white;
    border:1px solid #555;
}

.panel h2{
    margin-top:0;
}

.setting{
    margin:18px 0;
}

.setting label{
    display:block;
    color:#aaa;
    margin-bottom:7px;
}

.setting button{
    padding:9px 13px;
    margin:2px;
    background:#252525;
    border:1px solid #555;
    color:white;
    cursor:pointer;
}

.setting button.selected{
    background:#9a6638;
}

/* ================= HUD ================= */

#hud{
    position:fixed;
    inset:0;
    z-index:50;
    display:none;
    pointer-events:none;
    color:white;
}

#crosshair{
    position:absolute;
    left:50%;
    top:50%;
    width:20px;
    height:20px;
    transform:translate(-50%,-50%);
}

#crosshair div{
    position:absolute;
    background:white;
    box-shadow:0 0 3px #000;
}

#crosshair .h{
    width:18px;
    height:2px;
    top:9px;
    left:1px;
}

#crosshair .v{
    width:2px;
    height:18px;
    top:1px;
    left:9px;
}

#hp{
    position:absolute;
    left:22px;
    bottom:22px;
    font-size:25px;
    text-shadow:2px 2px 5px #000;
}

#ammo{
    position:absolute;
    right:25px;
    bottom:20px;
    font-size:30px;
    text-shadow:2px 2px 5px #000;
}

#score{
    position:absolute;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    font-size:18px;
    text-shadow:2px 2px 5px #000;
}

#fps{
    position:absolute;
    top:12px;
    right:15px;
    font-size:13px;
}

#area{
    position:absolute;
    bottom:70px;
    left:50%;
    transform:translateX(-50%);
    font-size:14px;
    text-shadow:2px 2px 5px #000;
}

#reloadText{
    position:absolute;
    bottom:20%;
    left:50%;
    transform:translateX(-50%);
    display:none;
    font-size:18px;
    text-shadow:2px 2px 5px #000;
}

/* ================= HITMARKER ================= */

#hitmarker{
    position:absolute;
    left:50%;
    top:50%;
    width:30px;
    height:30px;
    transform:translate(-50%,-50%);
    display:none;
}

#hitmarker:before,
#hitmarker:after{
    content:"";
    position:absolute;
    left:13px;
    top:2px;
    width:2px;
    height:26px;
    background:white;
}

#hitmarker:before{
    transform:rotate(45deg);
}

#hitmarker:after{
    transform:rotate(-45deg);
}

/* ================= WEAPON ================= */

/*
   DŮLEŽITÉ:
   Weapon je natočený rovně s kamerou.
   Hlaveň vede po ose Z směrem dopředu.
*/

#weapon{
    position:absolute;
    right:1%;
    bottom:-4%;
    width:500px;
    height:400px;
    pointer-events:none;
    transform-origin:center bottom;
    filter:drop-shadow(0 12px 10px rgba(0,0,0,.55));
}

/* rukávy */

.sleeve{
    position:absolute;
    background:linear-gradient(
        145deg,
        #343733,
        #171918
    );
    border-radius:25px;
}

#sleeve1{
    width:120px;
    height:170px;
    right:270px;
    top:230px;
    transform:rotate(-18deg);
}

#sleeve2{
    width:120px;
    height:170px;
    right:30px;
    top:220px;
    transform:rotate(20deg);
}

/* ruce */

.hand{
    position:absolute;
    width:100px;
    height:115px;
    background:linear-gradient(
        145deg,
        #c58b60,
        #875634
    );
    border-radius:45px;
    z-index:4;
}

#hand1{
    right:245px;
    top:175px;
    transform:rotate(-14deg);
}

#hand2{
    right:105px;
    top:165px;
    transform:rotate(18deg);
}

/* prsty */

.hand:after{
    content:"";
    position:absolute;
    width:70px;
    height:38px;
    left:15px;
    top:18px;
    border-radius:25px;
    background:#a96d47;
}

/* ================= RIFLE ================= */

/*
   Celá zbraň je orientovaná rovně.
*/

#rifleBody{
    position:absolute;
    right:115px;
    top:125px;
    width:245px;
    height:62px;
    background:
        linear-gradient(
            #303231,
            #111
        );
    border-radius:6px;
    transform:rotate(-2deg);
    z-index:3;
}

#rifleTop{
    position:absolute;
    right:130px;
    top:112px;
    width:220px;
    height:12px;
    background:#171918;
    border-radius:5px;
    z-index:5;
}

#rifleRail{
    position:absolute;
    right:160px;
    top:103px;
    width:145px;
    height:9px;
    background:#0b0c0c;
    z-index:5;
}

/*
   Hlaveň vede vodorovně.
*/

#barrel{
    position:absolute;
    right:-5px;
    top:143px;
    width:170px;
    height:18px;
    background:linear-gradient(
        #252727,
        #080909
    );
    border-radius:2px 15px 15px 2px;
    z-index:2;
}

#muzzle{
    position:absolute;
    right:-18px;
    top:139px;
    width:30px;
    height:27px;
    background:#080909;
    border-radius:4px;
    z-index:3;
}

/* zásobník */

#mag{
    position:absolute;
    right:230px;
    top:175px;
    width:48px;
    height:120px;
    background:linear-gradient(
        90deg,
        #111,
        #303231,
        #111
    );
    border-radius:4px 4px 12px 12px;
    transform:rotate(8deg);
    z-index:2;
}

/* grip */

#grip{
    position:absolute;
    right:142px;
    top:175px;
    width:48px;
    height:100px;
    background:#151716;
    border-radius:5px 5px 14px 14px;
    transform:rotate(-8deg);
    z-index:2;
}

/* pažba */

#stock{
    position:absolute;
    right:325px;
    top:117px;
    width:125px;
    height:65px;
    background:linear-gradient(
        #292b2a,
        #111
    );
    border-radius:14px 3px 3px 14px;
    transform:rotate(-5deg);
}

/* hledí */

#sight{
    position:absolute;
    right:275px;
    top:94px;
    width:45px;
    height:16px;
    background:#0c0d0d;
    z-index:6;
}

/* muzzle flash */

#flash{
    position:absolute;
    right:-70px;
    top:102px;
    width:120px;
    height:120px;
    display:none;
    background:
        radial-gradient(
            circle,
            white 0 10%,
            #ffe98b 20%,
            #ff9c27 42%,
            transparent 70%
        );
}

/* ================= MOBILE WARNING ================= */

@media(max-width:700px){
    #weapon{
        transform:scale(.65);
        right:-70px;
        bottom:-70px;
    }

    #menu h1{
        font-size:35px;
    }
}
</style>
</head>

<body>

<!-- ================= MENU ================= -->

<div id="menu">

    <h1>TACTICAL DESERT</h1>

    <p>TACTICAL FPS</p>

    <button
        class="menuBtn"
        id="play">
        PLAY
    </button>

    <button
        class="menuBtn"
        id="openSettings">
        SETTINGS
    </button>

</div>

<!-- ================= SETTINGS ================= -->

<div id="settings">

    <div class="panel">

        <h2>SETTINGS</h2>

        <div class="setting">
            <label>GRAPHICS</label>

            <button data-graphics="low">
                LOW
            </button>

            <button data-graphics="medium">
                MEDIUM
            </button>

            <button data-graphics="high">
                HIGH
            </button>
        </div>

        <div class="setting">
            <label>FPS LIMIT</label>

            <button data-fps="30">
                30
            </button>

            <button data-fps="60">
                60
            </button>

            <button data-fps="120">
                120
            </button>

            <button data-fps="0">
                UNLIMITED
            </button>
        </div>

        <div class="setting">
            <label>VIEW DISTANCE</label>

            <button data-distance="low">
                LOW
            </button>

            <button data-distance="medium">
                MEDIUM
            </button>

            <button data-distance="high">
                HIGH
            </button>
        </div>

        <button
            class="menuBtn"
            id="closeSettings">
            BACK
        </button>

    </div>

</div>

<!-- ================= HUD ================= -->

<div id="hud">

    <div id="crosshair">
        <div class="h"></div>
        <div class="v"></div>
    </div>

    <div id="hitmarker"></div>

    <div id="score">
        A 0 : 0 B
    </div>

    <div id="fps">
        FPS: 0
    </div>

    <div id="hp">
        HP: 100
    </div>

    <div id="ammo">
        <span id="ammoCount">30</span> / 90
    </div>

    <div id="area">
        MID
    </div>

    <div id="reloadText">
        RELOADING...
    </div>

    <!-- ================= WEAPON ================= -->

    <div id="weapon">

        <div id="flash"></div>

        <div
            class="sleeve"
            id="sleeve1">
        </div>

        <div
            class="sleeve"
            id="sleeve2">
        </div>

        <div
            class="hand"
            id="hand1">
        </div>

        <div
            class="hand"
            id="hand2">
        </div>

        <div id="stock"></div>

        <div id="rifleBody"></div>

        <div id="rifleTop"></div>

        <div id="rifleRail"></div>

        <div id="barrel"></div>

        <div id="muzzle"></div>

        <div id="mag"></div>

        <div id="grip"></div>

        <div id="sight"></div>

    </div>

</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

/* =====================================================
   SETTINGS
===================================================== */

let settings={
    graphics:"low",
    fps:60,
    distance:"medium"
};

try{

    const saved=
        JSON.parse(
            localStorage.getItem(
                "tacticalSettings"
            )
        );

    if(saved){

        settings={
            ...settings,
            ...saved
        };
    }

}catch(e){}

function saveSettings(){

    localStorage.setItem(
        "tacticalSettings",
        JSON.stringify(settings)
    );
}

/* =====================================================
   THREE.JS
===================================================== */

const scene=
    new THREE.Scene();

scene.background=
    new THREE.Color(
        0xc49a67
    );

/*
 IMPORTANT:
 Fog je vytvořen hned.
*/

scene.fog=
    new THREE.Fog(
        0xc49a67,
        120,
        450
    );

const camera=
    new THREE.PerspectiveCamera(
        75,
        innerWidth/innerHeight,
        .05,
        800
    );

const renderer=
    new THREE.WebGLRenderer({
        antialias:false,
        powerPreference:
            "high-performance"
    });

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(1);

document.body.appendChild(
    renderer.domElement
);

/* =====================================================
   LIGHT
===================================================== */

const sun=
    new THREE.DirectionalLight(
        0xffd5a0,
        2
    );

sun.position.set(
    -150,
    250,
    100
);

scene.add(sun);

scene.add(
    new THREE.HemisphereLight(
        0xffd8a8,
        0x423529,
        1.25
    )
);

/* =====================================================
   MATERIALS
===================================================== */

const materials={

    sand:
        new THREE.MeshLambertMaterial({
            color:0xc59661
        }),

    road:
        new THREE.MeshLambertMaterial({
            color:0x806043
        }),

    wall:
        new THREE.MeshLambertMaterial({
            color:0xb47c4b
        }),

    wallLight:
        new THREE.MeshLambertMaterial({
            color:0xd09b66
        }),

    dark:
        new THREE.MeshLambertMaterial({
            color:0x41362c
        }),

    wood:
        new THREE.MeshLambertMaterial({
            color:0x68411f
        }),

    metal:
        new THREE.MeshLambertMaterial({
            color:0x444747
        }),

    glass:
        new THREE.MeshLambertMaterial({
            color:0x35474c
        }),

    green:
        new THREE.MeshLambertMaterial({
            color:0x4d6048
        })
};

/* =====================================================
   MAP
===================================================== */

const obstacles=[];

function box(
    x,y,z,
    w,h,d,
    material,
    collision=true
){

    const mesh=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                w,h,d
            ),
            material
        );

    mesh.position.set(
        x,y,z
    );

    scene.add(mesh);

    if(collision){

        obstacles.push({
            x,
            z,
            w,
            d
        });
    }

    return mesh;
}

function cylinder(
    x,y,z,
    radius,height,
    material
){

    const mesh=
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                radius,
                radius,
                height,
                8
            ),
            material
        );

    mesh.position.set(
        x,y,z
    );

    scene.add(mesh);

    return mesh;
}

/* ================= GROUND ================= */

box(
    0,-2,0,
    620,4,620,
    materials.sand,
    false
);

/* ================= MAIN ROADS ================= */

box(
    0,.05,0,
    70,.1,590,
    materials.road,
    false
);

box(
    0,.06,0,
    590,.1,70,
    materials.road,
    false
);

/* ================= SIDE ROADS ================= */

box(
    -190,.07,0,
    70,.1,500,
    materials.road,
    false
);

box(
    190,.07,0,
    70,.1,500,
    materials.road,
    false
);

/* ================= OUTER WALL ================= */

box(
    0,18,-305,
    620,36,10,
    materials.wall
);

box(
    0,18,305,
    620,36,10,
    materials.wall
);

box(
    -305,18,0,
    10,36,620,
    materials.wall
);

box(
    305,18,0,
    10,36,620,
    materials.wall
);

/* =====================================================
   BUILDINGS
===================================================== */

function building(
    x,z,w,d,h=22
){

    box(
        x,
        h/2,
        z,
        w,
        h,
        d,
        materials.wall
    );

    /*
      střechy
    */

    box(
        x,
        h+.5,
        z,
        w+2,
        1,
        d+2,
        materials.wallLight,
        false
    );

    /*
      dveře
    */

    box(
        x,
        5,
        z-d/2-.3,
        7,
        10,
        .5,
        materials.dark,
        false
    );

    /*
      okna
    */

    for(
        let i=-1;
        i<=1;
        i++
    ){

        box(
            x+i*w*.28,
            h*.65,
            z-d/2-.4,
            7,
            4,
            .4,
            materials.glass,
            false
        );
    }
}

/* ================= A SITE ================= */

building(
    -225,
    -230,
    110,
    70,
    26
);

building(
    -150,
    -235,
    55,
    80,
    22
);

building(
    -250,
    -145,
    70,
    55,
    20
);

building(
    -155,
    -125,
    65,
    45,
    19
);

/* ================= B SITE ================= */

building(
    225,
    230,
    110,
    70,
    26
);

building(
    150,
    235,
    55,
    80,
    22
);

building(
    250,
    145,
    70,
    55,
    20
);

building(
    155,
    125,
    65,
    45,
    19
);

/* ================= LONG ================= */

building(
    -125,
    -185,
    60,
    80,
    21
);

building(
    125,
    -185,
    60,
    80,
    21
);

box(
    -55,
    9,
    -180,
    16,
    18,
    210,
    materials.wall
);

box(
    55,
    9,
    -180,
    16,
    18,
    210,
    materials.wall
);

/* ================= MID ================= */

building(
    -175,
    0,
    60,
    90,
    21
);

building(
    175,
    0,
    60,
    90,
    21
);

building(
    -115,
    75,
    50,
    55,
    19
);

building(
    115,
    75,
    50,
    55,
    19
);

/* ================= SHORT ================= */

box(
    -125,
    8,
    125,
    20,
    16,
    120,
    materials.wall
);

box(
    125,
    8,
    125,
    20,
    16,
    120,
    materials.wall
);

/* ================= MID COVER ================= */

for(
    let x=-70;
    x<=70;
    x+=28
){

    box(
        x,
        3,
        5,
        10,
        6,
        10,
        materials.wallLight
    );
}

/* ================= BOXES ================= */

for(
    let i=0;
    i<65;
    i++
){

    const x=
        Math.round(
            (Math.random()*500-250)/10
        )*10;

    const z=
        Math.round(
            (Math.random()*500-250)/10
        )*10;

    if(
        Math.abs(x)<55 &&
        Math.abs(z)<55
    )
        continue;

    box(
        x,
        3,
        z,
        7,
        6,
        7,
        materials.wood,
        true
    );
}

/* ================= BARRELS ================= */

for(
    let i=0;
    i<35;
    i++
){

    cylinder(
        Math.random()*500-250,
        4,
        Math.random()*500-250,
        3,
        8,
        materials.metal
    );
}

/* ================= PALMS ================= */

function palm(x,z){

    cylinder(
        x,
        8,
        z,
        1.5,
        16,
        materials.wood
    );

    if(
        settings.graphics==="low"
    )
        return;

    for(
        let i=0;
        i<6;
        i++
    ){

        box(
            x,
            16,
            z,
            2,
            1,
            14,
            materials.green,
            false
        );
    }
}

for(
    let i=0;
    i<25;
    i++
){

    palm(
        Math.random()*500-250,
        Math.random()*500-250
    );
}

/* =====================================================
   PLAYER
===================================================== */

const player=
    new THREE.Object3D();

scene.add(player);

player.position.set(
    -245,
    0,
    -250
);

player.add(camera);

camera.position.set(
    0,
    1.7,
    0
);

camera.rotation.order=
    "YXZ";

let yaw=0;
let pitch=0;

let keys={};

let playing=false;

/* =====================================================
   KEYBOARD
===================================================== */

document.addEventListener(
    "keydown",
    e=>{

        keys[e.code]=true;

        if(
            e.code==="KeyR"
        ){
            reload();
        }
    }
);

document.addEventListener(
    "keyup",
    e=>{
        keys[e.code]=false;
    }
);

/* =====================================================
   MOUSE LOOK
===================================================== */

document.addEventListener(
    "mousemove",
    e=>{

        if(
            document.pointerLockElement !==
            renderer.domElement
        )
            return;

        yaw -=
            e.movementX*.0022;

        pitch -=
            e.movementY*.0022;

        pitch=
            THREE.MathUtils.clamp(
                pitch,
                -1.5,
                1.5
            );

        player.rotation.y=
            yaw;

        camera.rotation.x=
            pitch;
    }
);

/* =====================================================
   COLLISION
===================================================== */

function collision(x,z){

    const r=2;

    for(
        const o of obstacles
    ){

        if(
            x >
                o.x-o.w/2-r &&
            x <
                o.x+o.w/2+r &&
            z >
                o.z-o.d/2-r &&
            z <
                o.z+o.d/2+r
        ){

            return true;
        }
    }

    return false;
}

/* =====================================================
   MOVEMENT
===================================================== */

const clock=
    new THREE.Clock();

function move(){

    const dt=
        Math.min(
            clock.getDelta(),
            .05
        );

    if(!playing)
        return;

    let speed=7;

    if(
        keys.ShiftLeft ||
        keys.ShiftRight
    )
        speed=11;

    if(
        keys.ControlLeft ||
        keys.ControlRight
    )
        speed=4;

    const forward=
        new THREE.Vector3(
            0,0,-1
        );

    const right=
        new THREE.Vector3(
            1,0,0
        );

    forward.applyQuaternion(
        player.quaternion
    );

    right.applyQuaternion(
        player.quaternion
    );

    const direction=
        new THREE.Vector3();

    if(keys.KeyW)
        direction.add(forward);

    if(keys.KeyS)
        direction.sub(forward);

    if(keys.KeyD)
        direction.add(right);

    if(keys.KeyA)
        direction.sub(right);

    if(
        direction.lengthSq()>0
    ){

        direction.normalize();

        const nx=
            player.position.x+
            direction.x*
            speed*
            dt;

        const nz=
            player.position.z+
            direction.z*
            speed*
            dt;

        if(
            !collision(
                nx,
                player.position.z
            )
        ){

            player.position.x=nx;
        }

        if(
            !collision(
                player.position.x,
                nz
            )
        ){

            player.position.z=nz;
        }
    }

    player.position.x=
        THREE.MathUtils.clamp(
            player.position.x,
            -292,
            292
        );

    player.position.z=
        THREE.MathUtils.clamp(
            player.position.z,
            -292,
            292
        );

    updateArea();
}

/* =====================================================
   AREA
===================================================== */

function updateArea(){

    const x=
        player.position.x;

    const z=
        player.position.z;

    let name="MID";

    if(
        x<-150 &&
        z<-150
    )
        name="A SITE";

    else if(
        x>150 &&
        z>150
    )
        name="B SITE";

    else if(
        z<-120 &&
        Math.abs(x)<100
    )
        name="LONG";

    else if(
        z>100 &&
        Math.abs(x)<100
    )
        name="SHORT";

    else if(
        Math.abs(x)<80 &&
        Math.abs(z)<80
    )
        name="MID";

    else
        name="SIDE";

    document.getElementById(
        "area"
    ).textContent=name;
}

/* =====================================================
   SHOOTING
===================================================== */

let ammo=30;

let reloading=false;

let lastShot=0;

function shoot(){

    if(!playing)
        return;

    if(reloading)
        return;

    if(ammo<=0){

        reload();

        return;
    }

    const now=
        performance.now();

    if(
        now-lastShot<115
    )
        return;

    lastShot=now;

    ammo--;

    document.getElementById(
        "ammoCount"
    ).textContent=ammo;

    /* muzzle flash */

    const flash=
        document.getElementById(
            "flash"
        );

    flash.style.display=
        "block";

    setTimeout(
        ()=>{
            flash.style.display=
                "none";
        },
        55
    );

    /* recoil */

    const weapon=
        document.getElementById(
            "weapon"
        );

    weapon.animate(
        [
            {
                transform:
                    "translate(0,0)"
            },
            {
                transform:
                    "translate(-7px,10px)"
            },
            {
                transform:
                    "translate(0,0)"
            }
        ],
        {
            duration:100
        }
    );

    /* ray */

    const ray=
        new THREE.Raycaster();

    ray.setFromCamera(
        new THREE.Vector2(0,0),
        camera
    );

    const hit=
        ray.intersectObjects(
            scene.children,
            true
        );

    if(
        hit.length>0
    ){

        const marker=
            document.getElementById(
                "hitmarker"
            );

        marker.style.display=
            "block";

        setTimeout(
            ()=>{
                marker.style.display=
                    "none";
            },
            70
        );
    }
}

/* =====================================================
   RELOAD
===================================================== */

function reload(){

    if(reloading)
        return;

    if(ammo===30)
        return;

    reloading=true;

    document.getElementById(
        "reloadText"
    ).style.display=
        "block";

    const weapon=
        document.getElementById(
            "weapon"
        );

    weapon.animate(
        [
            {
                transform:
                    "translate(0,0)"
            },
            {
                transform:
                    "translate(30px,40px) rotate(8deg)"
            },
            {
                transform:
                    "translate(-20px,20px) rotate(-5deg)"
            },
            {
                transform:
                    "translate(0,0)"
            }
        ],
        {
            duration:1100
        }
    );

    setTimeout(
        ()=>{

            ammo=30;

            document.getElementById(
                "ammoCount"
            ).textContent=ammo;

            document.getElementById(
                "reloadText"
            ).style.display=
                "none";

            reloading=false;

        },
        1100
    );
}

/* =====================================================
   SHOOT CLICK
===================================================== */

document.addEventListener(
    "mousedown",
    e=>{

        if(
            e.button===0 &&
            playing &&
            document.pointerLockElement===
            renderer.domElement
        ){

            shoot();
        }
    }
);

/* =====================================================
   SETTINGS
===================================================== */

function applySettings(){

    if(
        settings.graphics==="low"
    ){

        renderer.setPixelRatio(1);

        scene.fog.near=80;
        scene.fog.far=
            settings.distance==="low"
            ? 250
            : 400;

    }else if(
        settings.graphics==="medium"
    ){

        renderer.setPixelRatio(
            Math.min(
                devicePixelRatio,
                1.25
            )
        );

        scene.fog.near=120;
        scene.fog.far=
            settings.distance==="low"
            ? 300
            : 500;

    }else{

        renderer.setPixelRatio(
            Math.min(
                devicePixelRatio,
                1.5
            )
        );

        scene.fog.near=160;
        scene.fog.far=
            settings.distance==="high"
            ? 700
            : 500;
    }

    saveSettings();

    updateButtons();
}

function updateButtons(){

    document
        .querySelectorAll(
            "[data-graphics]"
        )
        .forEach(
            b=>{
                b.classList.toggle(
                    "selected",
                    b.dataset.graphics===
                    settings.graphics
                );
            }
        );

    document
        .querySelectorAll(
            "[data-fps]"
        )
        .forEach(
            b=>{
                b.classList.toggle(
                    "selected",
                    Number(
                        b.dataset.fps
                    )===
                    settings.fps
                );
            }
        );

    document
        .querySelectorAll(
            "[data-distance]"
        )
        .forEach(
            b=>{
                b.classList.toggle(
                    "selected",
                    b.dataset.distance===
                    settings.distance
                );
            }
        );
}

/* graphics */

document
    .querySelectorAll(
        "[data-graphics]"
    )
    .forEach(
        b=>{

            b.onclick=()=>{

                settings.graphics=
                    b.dataset.graphics;

                applySettings();
            };
        }
    );

/* fps */

document
    .querySelectorAll(
        "[data-fps]"
    )
    .forEach(
        b=>{

            b.onclick=()=>{

                settings.fps=
                    Number(
                        b.dataset.fps
                    );

                applySettings();
            };
        }
    );

/* distance */

document
    .querySelectorAll(
        "[data-distance]"
    )
    .forEach(
        b=>{

            b.onclick=()=>{

                settings.distance=
                    b.dataset.distance;

                applySettings();
            };
        }
    );

/* =====================================================
   MENU
===================================================== */

document.getElementById(
    "openSettings"
).onclick=()=>{

    document.getElementById(
        "settings"
    ).style.display=
        "flex";

    updateButtons();
};

document.getElementById(
    "closeSettings"
).onclick=()=>{

    document.getElementById(
        "settings"
    ).style.display=
        "none";
};

/* =====================================================
   PLAY
===================================================== */

document.getElementById(
    "play"
).onclick=async()=>{

    playing=true;

    document.getElementById(
        "menu"
    ).style.display=
        "none";

    document.getElementById(
        "hud"
    ).style.display=
        "block";

    player.position.set(
        -245,
        0,
        -250
    );

    yaw=0;
    pitch=0;

    player.rotation.y=0;
    camera.rotation.x=0;

    try{

        await renderer
            .domElement
            .requestPointerLock();

    }catch(error){

        console.log(
            error
        );
    }
};

/* =====================================================
   ESC
===================================================== */

document.addEventListener(
    "pointerlockchange",
    ()=>{

        if(
            document.pointerLockElement !==
            renderer.domElement
        ){

            if(playing){

                playing=false;

                document.getElementById(
                    "hud"
                ).style.display=
                    "none";

                document.getElementById(
                    "menu"
                ).style.display=
                    "flex";
            }
        }
    }
);

/* =====================================================
   FPS
===================================================== */

let frames=0;

let fpsTimer=
    performance.now();

let lastRender=0;

function showFPS(){

    frames++;

    const now=
        performance.now();

    if(
        now-fpsTimer>=1000
    ){

        document.getElementById(
            "fps"
        ).textContent=
            "FPS: "+frames;

        frames=0;

        fpsTimer=now;
    }
}

/* =====================================================
   LOOP
===================================================== */

function animate(time){

    requestAnimationFrame(
        animate
    );

    if(
        settings.fps>0
    ){

        const interval=
            1000/settings.fps;

        if(
            time-lastRender<
            interval
        )
            return;

        lastRender=time;
    }

    move();

    showFPS();

    renderer.render(
        scene,
        camera
    );
}

/* =====================================================
   START
===================================================== */

applySettings();

animate(0);

/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);

</script>
